<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrownChat App Prototype</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B0000', // Burgundy Dark Red
                            light: '#a31b1b',
                            dark: '#660000',
                            50: '#fcf3f3',
                            100: '#fae6e6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; /* Light gray background for the "desktop" wrapper */
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for clean mobile look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Material Design input focus effects */
        .material-input:focus-within {
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- HILFSKOMPONENTE FÜR ICONS ---
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: { width: size, height: size, class: className, 'stroke-width': strokeWidth }
                    });
                }
            }, [name, size, className, strokeWidth]);
            
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        };

        // --- ONBOARDING VIEWS ---

        const OnboardingWelcome = ({ onNext }) => (
            <div className="flex flex-col items-center justify-center h-full p-6 text-center animate-fade-in bg-white">
                <div className="w-24 h-24 bg-brand-50 rounded-full flex items-center justify-center mb-8 shadow-sm border border-brand-100">
                    <Icon name="qr-code" size={48} className="text-brand" />
                </div>
                <h1 className="text-3xl font-black text-gray-900 mb-3 tracking-tight">CrownChat</h1>
                <h2 className="text-lg font-semibold text-gray-700 mb-4">Willkommen im Team!</h2>
                
                <div className="bg-brand-50 border border-brand-100 rounded-2xl p-4 mb-10 w-full max-w-xs relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-brand"></div>
                    <p className="text-sm text-gray-700 font-medium leading-relaxed">
                        Dein persönlicher Einladungslink wurde erfolgreich gescannt.
                    </p>
                    <div className="mt-3 inline-flex items-center gap-1.5 bg-brand text-white text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full">
                        <Icon name="clock" size={12} />
                        Nur 2 Tage gültig
                    </div>
                </div>

                <button 
                    onClick={onNext}
                    className="w-full max-w-xs py-3.5 bg-brand hover:bg-brand-light text-white rounded-xl font-bold shadow-lg shadow-brand/30 transition-all active:scale-95 flex items-center justify-center gap-2"
                >
                    Registrierung starten <Icon name="arrow-right" size={18} />
                </button>
            </div>
        );

        const OnboardingGatekeeper = ({ onNext }) => {
            const [personalNr, setPersonalNr] = useState('');
            const [pin, setPin] = useState('');
            const [error, setError] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (personalNr.length > 0 && pin.length >= 4) {
                    onNext();
                } else {
                    setError(true);
                    setTimeout(() => setError(false), 2000);
                }
            };

            return (
                <div className="flex flex-col h-full bg-white animate-fade-in">
                    <div className="p-6 pt-12 pb-6 flex flex-col items-center border-b border-gray-100">
                        <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                            <Icon name="shield-check" size={32} className="text-gray-700" />
                        </div>
                        <h2 className="text-2xl font-black text-gray-900">Türsteher-Check</h2>
                        <p className="text-sm text-gray-500 mt-2 text-center">Bitte weise dich mit deinen GastroCrown Daten aus.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="p-6 flex-1 flex flex-col">
                        <div className="space-y-5 flex-1">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Personalnummer</label>
                                <div className="material-input flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 transition-all">
                                    <Icon name="hash" size={18} className="text-gray-400 mr-3" />
                                    <input 
                                        type="text" 
                                        value={personalNr}
                                        onChange={(e) => setPersonalNr(e.target.value)}
                                        placeholder="z.B. 1414"
                                        className="bg-transparent w-full outline-none text-gray-800 font-medium"
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">4-stellige Kassen-PIN</label>
                                <div className="material-input flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 transition-all">
                                    <Icon name="lock" size={18} className="text-gray-400 mr-3" />
                                    <input 
                                        type="password" 
                                        value={pin}
                                        onChange={(e) => setPin(e.target.value)}
                                        placeholder="••••"
                                        maxLength="4"
                                        className="bg-transparent w-full outline-none text-gray-800 font-black tracking-widest text-lg"
                                    />
                                </div>
                            </div>

                            {error && (
                                <div className="text-red-500 text-xs font-bold flex items-center gap-1.5 animate-fade-in">
                                    <Icon name="alert-circle" size={14} /> Bitte alle Felder korrekt ausfüllen.
                                </div>
                            )}
                        </div>

                        <button 
                            type="submit"
                            className="w-full py-4 bg-gray-900 hover:bg-black text-white rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 mt-auto"
                        >
                            <Icon name="unlock" size={18} /> Sicher freischalten
                        </button>
                    </form>
                </div>
            );
        };

        const OnboardingSetup = ({ onNext }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [accepted, setAccepted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (email && password && accepted) {
                    onNext();
                }
            };

            return (
                <div className="flex flex-col h-full bg-white animate-fade-in">
                    <div className="p-6 pt-12 pb-6 flex flex-col items-center border-b border-gray-100">
                        <div className="w-16 h-16 bg-brand-50 rounded-full flex items-center justify-center mb-4 border border-brand-100">
                            <Icon name="user-plus" size={32} className="text-brand" />
                        </div>
                        <h2 className="text-2xl font-black text-gray-900">Konto einrichten</h2>
                        <p className="text-sm text-gray-500 mt-2 text-center">Registrierung erfolgreich freigeschaltet. Lege nun deine Login-Daten fest.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="p-6 flex-1 flex flex-col">
                        <div className="space-y-4 flex-1">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Private E-Mail Adresse</label>
                                <div className="material-input flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 transition-all">
                                    <Icon name="mail" size={18} className="text-gray-400 mr-3" />
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="name@beispiel.de"
                                        className="bg-transparent w-full outline-none text-gray-800 font-medium"
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Passwort für die App</label>
                                <div className="material-input flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 transition-all">
                                    <Icon name="key" size={18} className="text-gray-400 mr-3" />
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="Mindestens 8 Zeichen"
                                        className="bg-transparent w-full outline-none text-gray-800 font-medium"
                                    />
                                </div>
                            </div>

                            <div className="pt-4">
                                <label className="flex items-start gap-3 cursor-pointer group">
                                    <div className="relative flex items-center justify-center mt-0.5">
                                        <input 
                                            type="checkbox" 
                                            checked={accepted}
                                            onChange={(e) => setAccepted(e.target.checked)}
                                            className="appearance-none w-5 h-5 border-2 border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-brand/50 checked:bg-brand checked:border-brand transition-colors cursor-pointer"
                                        />
                                        {accepted && <Icon name="check" size={14} className="text-white absolute pointer-events-none" strokeWidth={3} />}
                                    </div>
                                    <span className="text-xs text-gray-600 leading-relaxed font-medium">
                                        Ich stimme zu, dass meine E-Mail für zukünftige Logins in der App gespeichert wird (<span className="text-brand underline">Datenschutzerklärung</span>).
                                    </span>
                                </label>
                            </div>
                        </div>

                        <button 
                            type="submit"
                            disabled={!accepted || !email || !password}
                            className={`w-full py-4 rounded-xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 mt-auto ${accepted && email && password ? 'bg-brand hover:bg-brand-light text-white active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                        >
                            Konto aktivieren <Icon name="check-circle" size={18} />
                        </button>
                    </form>
                </div>
            );
        };

        // --- MAIN APP TABS ---

        const TabFeed = () => (
            <div className="animate-fade-in pb-20">
                {/* Header */}
                <div className="bg-white px-5 pt-6 pb-4 sticky top-0 z-10 border-b border-gray-100">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-black text-gray-900 tracking-tight">Crown<span className="text-brand">Chat</span></h2>
                        <div className="flex gap-3">
                            <button className="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition"><Icon name="search" size={18} /></button>
                            <button className="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition relative">
                                <Icon name="bell" size={18} />
                                <span className="absolute top-2 right-2 w-2 h-2 bg-brand rounded-full"></span>
                            </button>
                        </div>
                    </div>
                </div>

                {/* Stories Row */}
                <div className="bg-white px-4 py-5 mb-2 flex gap-4 overflow-x-auto no-scrollbar border-b border-gray-100">
                    {/* Add Story Button */}
                    <div className="flex flex-col items-center gap-1.5 shrink-0">
                        <div className="w-16 h-16 rounded-full bg-gray-100 border border-dashed border-gray-300 flex items-center justify-center text-gray-400 relative">
                            <Icon name="plus" size={24} />
                        </div>
                        <span className="text-[10px] font-bold text-gray-500">Neu</span>
                    </div>
                    {/* Dummy Stories */}
                    {['Schnitzelwelt', 'Küche Meppen', 'Service Team'].map((name, i) => (
                        <div key={i} className="flex flex-col items-center gap-1.5 shrink-0">
                            <div className="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-brand to-purple-500">
                                <div className="w-full h-full rounded-full border-2 border-white overflow-hidden bg-white">
                                    <img src={`https://placehold.co/100x100/eeeeee/8B0000?text=${name[0]}`} className="w-full h-full object-cover" alt="story" />
                                </div>
                            </div>
                            <span className="text-[10px] font-medium text-gray-700 w-16 truncate text-center">{name}</span>
                        </div>
                    ))}
                </div>

                {/* Feed Post */}
                <div className="bg-white p-5 border-b border-gray-100">
                    <div className="flex justify-between items-start mb-4">
                        <div className="flex gap-3 items-center">
                            <div className="w-10 h-10 rounded-full bg-brand-50 flex items-center justify-center text-brand font-bold">
                                EK
                            </div>
                            <div>
                                <h4 className="font-bold text-sm text-gray-900">Enno Knuth</h4>
                                <span className="text-xs text-gray-500">Gerade eben • Allgemein</span>
                            </div>
                        </div>
                        <button className="text-gray-400 hover:text-gray-600"><Icon name="more-horizontal" size={20} /></button>
                    </div>
                    
                    <p className="text-sm text-gray-800 leading-relaxed mb-4">
                        🎉 Verstärkung für unsere Schnitzelwelt-Küche! <br/><br/>
                        Liebe Crew, wir freuen uns, euch unseren neuen Küchenchef Markus vorzustellen! Er startet am 1. November bei uns. Lasst uns ihm einen tollen Start bereiten! 🥩👑
                    </p>
                    
                    <div className="rounded-xl overflow-hidden mb-4 bg-gray-100 h-48">
                        <img src="https://placehold.co/400x200/e5e7eb/a3a3a3?text=Team+Foto" className="w-full h-full object-cover" alt="Post attachment" />
                    </div>

                    <div className="flex justify-between items-center pt-2">
                        <div className="flex gap-2">
                            <button className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-50 hover:bg-gray-100 rounded-full text-xs font-semibold text-gray-700 transition">
                                <Icon name="heart" size={16} /> 12
                            </button>
                            <button className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-50 hover:bg-gray-100 rounded-full text-xs font-semibold text-gray-700 transition">
                                <Icon name="message-circle" size={16} /> 3
                            </button>
                        </div>
                        
                        <div className="flex items-center gap-1 text-xs font-bold text-gray-400 bg-gray-50 px-2.5 py-1.5 rounded-full">
                            <Icon name="eye" size={14} /> 4
                        </div>
                    </div>
                </div>
            </div>
        );

        const TabChat = () => (
            <div className="animate-fade-in flex flex-col h-full bg-white">
                <div className="px-5 pt-6 pb-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 className="text-2xl font-black text-gray-900 tracking-tight">Nachrichten</h2>
                    <button className="w-10 h-10 rounded-full bg-brand text-white flex items-center justify-center shadow-md hover:bg-brand-light transition">
                        <Icon name="plus" size={20} />
                    </button>
                </div>
                
                <div className="p-4">
                    <div className="bg-gray-50 border border-gray-100 rounded-xl flex items-center px-4 py-2.5 mb-4">
                        <Icon name="search" size={18} className="text-gray-400 mr-2" />
                        <input type="text" placeholder="Suchen..." className="bg-transparent w-full text-sm outline-none" />
                    </div>
                    
                    <div className="space-y-1">
                        {[
                            { name: 'Küche Meppen', msg: 'Zählung ist durch! ✅', time: '14:30', unread: 2, isGroup: true },
                            { name: 'Marina Jänen', msg: 'Brauchen noch Servietten vorne.', time: '11:15', unread: 0, isGroup: false },
                            { name: 'Service Team', msg: 'Wer übernimmt morgen die Frühschicht?', time: 'Gestern', unread: 0, isGroup: true }
                        ].map((chat, i) => (
                            <div key={i} className="flex items-center gap-4 p-3 hover:bg-gray-50 rounded-2xl cursor-pointer transition">
                                <div className="relative">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-white font-bold ${chat.isGroup ? 'bg-gray-800' : 'bg-brand'}`}>
                                        {chat.isGroup ? <Icon name="users" size={20} /> : chat.name.charAt(0)}
                                    </div>
                                    {chat.unread > 0 && (
                                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 border-2 border-white rounded-full flex items-center justify-center text-[10px] font-bold text-white">
                                            {chat.unread}
                                        </span>
                                    )}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="flex justify-between items-baseline mb-0.5">
                                        <h4 className="font-bold text-sm text-gray-900 truncate">{chat.name}</h4>
                                        <span className="text-[10px] text-gray-400 shrink-0 ml-2">{chat.time}</span>
                                    </div>
                                    <p className={`text-xs truncate ${chat.unread > 0 ? 'text-gray-800 font-semibold' : 'text-gray-500'}`}>
                                        {chat.msg}
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const TabSchedule = () => (
            <div className="animate-fade-in bg-gray-50 h-full pb-20">
                <div className="bg-white px-5 pt-6 pb-4 border-b border-gray-100">
                    <h2 className="text-2xl font-black text-gray-900 tracking-tight">Dienstplan</h2>
                    <div className="flex justify-between items-center mt-4 text-sm font-bold text-gray-800">
                        <button><Icon name="chevron-left" size={20} /></button>
                        <span>Okt 19 - 25, 2026</span>
                        <button><Icon name="chevron-right" size={20} /></button>
                    </div>
                    {/* Days row */}
                    <div className="flex justify-between mt-6">
                        {['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((day, i) => (
                            <div key={i} className={`flex flex-col items-center gap-1 ${i === 2 ? 'text-brand' : 'text-gray-400'}`}>
                                <span className="text-[10px] font-bold uppercase">{day}</span>
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${i === 2 ? 'bg-brand text-white shadow-md' : 'text-gray-800'}`}>
                                    {19 + i}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="p-5 space-y-4">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Deine Schichten</h3>
                    
                    <div className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm border-l-4 border-l-brand">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-xs font-bold text-brand bg-brand-50 px-2 py-1 rounded">Front of House</span>
                            <span className="text-xs font-bold text-gray-400">Heute</span>
                        </div>
                        <h4 className="font-black text-lg text-gray-900">09:00 - 17:00</h4>
                        <p className="text-sm text-gray-500 mt-1 flex items-center gap-1.5">
                            <Icon name="map-pin" size={14} /> Schnitzelwelt Meppen
                        </p>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm border-l-4 border-l-gray-300 opacity-60">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-1 rounded">Back of House</span>
                            <span className="text-xs font-bold text-gray-400">Morgen</span>
                        </div>
                        <h4 className="font-black text-lg text-gray-900">11:00 - 19:30</h4>
                        <p className="text-sm text-gray-500 mt-1 flex items-center gap-1.5">
                            <Icon name="map-pin" size={14} /> Schnitzelwelt Meppen
                        </p>
                    </div>
                </div>
            </div>
        );

        const TabHub = () => (
            <div className="animate-fade-in bg-gray-50 h-full pb-20">
                <div className="bg-white px-5 pt-6 pb-4 border-b border-gray-100">
                    <h2 className="text-2xl font-black text-gray-900 tracking-tight">Hub</h2>
                    <p className="text-sm text-gray-500 mt-1">Wissen & Handbücher</p>
                </div>
                
                <div className="p-5">
                    {/* To Do Banner */}
                    <div className="bg-brand text-white rounded-2xl p-4 mb-6 shadow-lg relative overflow-hidden flex items-center justify-between">
                        <div className="absolute -right-4 -top-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                        <div>
                            <span className="text-[10px] font-bold uppercase tracking-wider bg-black/20 px-2 py-1 rounded-md mb-2 inline-block">Offener Kurs</span>
                            <h3 className="font-bold text-sm">Willkommen bei Schnitzelwelt</h3>
                            <p className="text-xs opacity-80 mt-1">Dein Einarbeitungskurs ist bereit</p>
                        </div>
                        <Icon name="chevron-right" size={24} />
                    </div>

                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Kategorien</h3>
                    <div className="grid grid-cols-2 gap-3">
                        {[
                            { name: 'Service am Gast', color: 'bg-orange-50 text-orange-700', icon: 'coffee' },
                            { name: 'Küche & Grundlagen', color: 'bg-red-50 text-red-700', icon: 'utensils' },
                            { name: 'Produktwissen', color: 'bg-blue-50 text-blue-700', icon: 'book' },
                            { name: 'Hygiene (HACCP)', color: 'bg-emerald-50 text-emerald-700', icon: 'shield-check' }
                        ].map((cat, i) => (
                            <div key={i} className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm flex flex-col items-center text-center gap-2 cursor-pointer hover:border-brand transition">
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center ${cat.color}`}>
                                    <Icon name={cat.icon} size={20} />
                                </div>
                                <span className="font-bold text-xs text-gray-800 leading-tight">{cat.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const TabProfile = () => (
            <div className="animate-fade-in bg-white h-full pb-20">
                <div className="px-5 pt-8 pb-6 border-b border-gray-100 flex items-center gap-4 bg-gray-50">
                    <div className="w-20 h-20 rounded-full bg-brand flex items-center justify-center text-white text-2xl font-black shadow-md border-4 border-white">
                        M
                    </div>
                    <div>
                        <h2 className="text-2xl font-black text-gray-900 tracking-tight">Marvin</h2>
                        <p className="text-sm text-gray-500 font-medium mt-0.5">Service • Meppen</p>
                    </div>
                </div>

                <div className="p-5">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Verdiente Abzeichen</h3>
                    <div className="flex gap-2 mb-6">
                        <div className="px-3 py-2 bg-yellow-50 border border-yellow-200 rounded-xl flex items-center gap-2">
                            <span className="text-lg">🥩</span>
                            <span className="text-xs font-bold text-yellow-800">Frisch paniert</span>
                        </div>
                    </div>

                    <div className="space-y-2">
                        {[
                            { title: 'Dein Profil', sub: 'Persönliche Infos bearbeiten', icon: 'user' },
                            { title: 'Mitarbeiterverzeichnis', sub: 'Kollegen finden', icon: 'users' },
                            { title: 'Benachrichtigungen', sub: 'Ruhezeiten einstellen', icon: 'bell' },
                            { title: 'Hilfe & Support', sub: 'Fragen zur App', icon: 'help-circle' }
                        ].map((item, i) => (
                            <div key={i} className="flex items-center justify-between p-4 border border-gray-100 rounded-2xl cursor-pointer hover:bg-gray-50 transition">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
                                        <Icon name={item.icon} size={18} />
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-sm text-gray-900">{item.title}</h4>
                                        <p className="text-[10px] text-gray-500 mt-0.5">{item.sub}</p>
                                    </div>
                                </div>
                                <Icon name="chevron-right" size={18} className="text-gray-400" />
                            </div>
                        ))}

                        <div className="mt-6 p-4 flex items-center gap-3 text-red-600 cursor-pointer hover:bg-red-50 rounded-2xl transition">
                            <Icon name="log-out" size={18} />
                            <span className="font-bold text-sm">Abmelden</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP WRAPPER ---

        const MainApp = () => {
            const [activeTab, setActiveTab] = useState('feed');

            const tabs = [
                { id: 'feed', icon: 'home', label: 'Feed' },
                { id: 'chat', icon: 'message-circle', label: 'Chat' },
                { id: 'schedule', icon: 'calendar', label: 'Dienstplan' },
                { id: 'hub', icon: 'book-open', label: 'Hub' },
                { id: 'profile', icon: 'user', label: 'Du' }
            ];

            return (
                <div className="flex flex-col h-full relative bg-white animate-fade-in">
                    {/* Content Area */}
                    <div className="flex-1 overflow-y-auto no-scrollbar relative">
                        {activeTab === 'feed' && <TabFeed />}
                        {activeTab === 'chat' && <TabChat />}
                        {activeTab === 'schedule' && <TabSchedule />}
                        {activeTab === 'hub' && <TabHub />}
                        {activeTab === 'profile' && <TabProfile />}
                    </div>

                    {/* Bottom Navigation */}
                    <div className="absolute bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-around items-center z-50 px-2 pb-safe">
                        {tabs.map(tab => {
                            const isActive = activeTab === tab.id;
                            return (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center justify-center w-16 h-full transition-colors ${isActive ? 'text-brand' : 'text-gray-400 hover:text-gray-600'}`}
                                >
                                    <Icon name={tab.icon} size={24} className={isActive ? 'mb-0.5' : 'mb-0.5 opacity-80'} strokeWidth={isActive ? 2.5 : 2} />
                                    <span className={`text-[10px] ${isActive ? 'font-bold' : 'font-medium'}`}>{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };


        // --- APP CONTROLLER ---

        const App = () => {
            // State machine for the app flow: 'welcome' -> 'gatekeeper' -> 'setup' -> 'main'
            const [view, setView] = useState('welcome');

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {/* Mobile Phone Mockup Container */}
                    <div className="w-full max-w-[390px] h-[844px] max-h-[90vh] bg-white rounded-[2.5rem] shadow-2xl overflow-hidden relative border-[6px] border-gray-900 flex flex-col">
                        
                        {/* iOS Status Bar Mockup */}
                        <div className="h-7 w-full bg-transparent absolute top-0 z-50 flex justify-between items-end px-6 pb-1 pointer-events-none">
                            <span className="text-[11px] font-bold text-gray-800">12:00</span>
                            <div className="flex gap-1.5 items-center">
                                <Icon name="signal" size={12} className="text-gray-800" strokeWidth={3} />
                                <Icon name="wifi" size={12} className="text-gray-800" strokeWidth={3} />
                                <Icon name="battery" size={14} className="text-gray-800" />
                            </div>
                        </div>

                        {/* View Router */}
                        <div className="flex-1 mt-7 overflow-hidden">
                            {view === 'welcome' && <OnboardingWelcome onNext={() => setView('gatekeeper')} />}
                            {view === 'gatekeeper' && <OnboardingGatekeeper onNext={() => setView('setup')} />}
                            {view === 'setup' && <OnboardingSetup onNext={() => setView('main')} />}
                            {view === 'main' && <MainApp />}
                        </div>

                        {/* iOS Home Indicator Mockup */}
                        <div className="h-5 w-full absolute bottom-0 flex justify-center items-center pointer-events-none z-50">
                            <div className="w-1/3 h-1 bg-gray-900 rounded-full opacity-20"></div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
