<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrownChat - GastroCrown Enterprise</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B0000', // Burgundy Dark Red
                            light: '#a31b1b',
                            dark: '#660000',
                            50: '#fcf3f3',
                            100: '#fae6e6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'google': '0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15)',
                        'google-hover': '0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15)',
                        'float': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.5)',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(139, 0, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(139, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 0, 0, 0); }
        }

        .material-input {
            transition: all 0.2s ease-in-out;
        }
        .material-input:focus-within {
            border-color: #8B0000;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.08);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =========================================================================
        // HILFSKOMPONENTEN
        // =========================================================================
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: { width: size, height: size, class: className, 'stroke-width': strokeWidth }
                    });
                }
            }, [name, size, className, strokeWidth]);
            
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        };

        const Toast = ({ message, type = 'info', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 5000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 right-6 z-[100] px-5 py-4 rounded-2xl shadow-float text-sm font-bold flex items-center gap-3 animate-fade-up border ${type === 'error' ? 'bg-red-600 text-white border-red-700' : type === 'warning' ? 'bg-amber-500 text-white border-amber-600' : 'glass-dark text-white border-slate-700/50'}`}>
                    <Icon name={type === 'error' ? 'alert-triangle' : type === 'warning' ? 'alert-circle' : 'check-circle-2'} size={18} className="text-white" />
                    <span>{message}</span>
                    <button onClick={onClose} className="ml-2 opacity-60 hover:opacity-100 transition"><Icon name="x" size={14} /></button>
                </div>
            );
        };

        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : 'https://gastrocrown.com/api';

        // =========================================================================
        // 1. REGULÄRER LOGIN (Normaler Arbeitsalltag mit E-Mail ODER PIN)
        // =========================================================================
        const LoginScreen = ({ onLoginSuccess }) => {
            const [identifier, setIdentifier] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [errorType, setErrorType] = useState('error');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                try {
                    const response = await fetch(`${API_BASE}/crownchat/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier: identifier.trim(), password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        onLoginSuccess(data.user);
                    } else {
                        if (response.status === 403) {
                            setErrorType('warning'); 
                        } else {
                            setErrorType('error'); 
                        }
                        setErrorMsg(data.message || 'Ungültige Anmeldedaten.');
                    }
                } catch (err) {
                    // Fallback nur für lokale Tests
                    if (identifier && password) {
                        onLoginSuccess({ id: 1414, name: 'Marvin Ringer', role: 'Inhaber / Admin', branch: 'Schnitzelwelt Meppen', departments: ['management', 'service'] });
                    } else {
                        setErrorType('error');
                        setErrorMsg('Netzwerkfehler: Server nicht erreichbar.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-[#05070a] relative overflow-hidden p-4 font-sans">
                    
                    {/* Atmosphärischer, moderner Hintergrund (Google/Apple Hybrid) */}
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                        <div className="absolute -top-[10%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-brand/20 blur-[120px] mix-blend-screen opacity-70"></div>
                        <div className="absolute top-[40%] -right-[10%] w-[40vw] h-[40vw] rounded-full bg-blue-900/20 blur-[100px] mix-blend-screen opacity-50"></div>
                        <div className="absolute -bottom-[20%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-rose-900/10 blur-[130px] mix-blend-screen opacity-60"></div>
                    </div>

                    <div className="w-full max-w-md bg-slate-900/70 backdrop-blur-2xl rounded-[2rem] shadow-2xl border border-slate-700/50 animate-fade-up p-8 relative z-10">
                        
                        {/* Header Area */}
                        <div className="flex flex-col items-center justify-center mb-8">
                            <div className="w-16 h-16 rounded-[1.25rem] overflow-hidden shadow-float mb-4 border border-brand/30 bg-gradient-to-br from-brand to-brand-dark p-0.5">
                                <div className="w-full h-full rounded-[1.1rem] overflow-hidden bg-brand">
                                    <img src="http://gastrocrown.com/images/CrownChat/CrownChat-App-Icon.png" alt="Logo" className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; }} />
                                </div>
                            </div>
                            <h1 className="font-black text-white text-2xl tracking-tight">Crown<span className="text-brand">Chat</span></h1>
                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Enterprise Login</span>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">E-Mail oder Mitarbeiter-PIN</label>
                                <div className="relative flex items-center group">
                                    <span className="absolute left-4 text-slate-500 group-focus-within:text-brand transition-colors"><Icon name="user" size={18} /></span>
                                    <input 
                                        type="text" 
                                        value={identifier}
                                        onChange={(e) => setIdentifier(e.target.value)}
                                        placeholder="Deine E-Mail oder Mitarbeiter-PIN"
                                        required
                                        className="w-full bg-slate-950/60 border border-slate-700/80 rounded-2xl pl-12 pr-4 py-3.5 text-sm font-semibold text-white outline-none focus:border-brand focus:bg-slate-900 transition-all shadow-inner"
                                    />
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-2 ml-1">
                                    <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider">Passwort</label>
                                    <a href="#" onClick={(e) => { e.preventDefault(); alert('Bitte wende dich an deinen Schichtleiter, um dein Passwort zurückzusetzen.'); }} className="text-[10px] font-bold text-slate-400 hover:text-brand transition">Zugangsdaten vergessen?</a>
                                </div>
                                <div className="relative flex items-center group">
                                    <span className="absolute left-4 text-slate-500 group-focus-within:text-brand transition-colors"><Icon name="lock" size={18} /></span>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        required
                                        className="w-full bg-slate-950/60 border border-slate-700/80 rounded-2xl pl-12 pr-4 py-3.5 text-sm font-semibold text-white outline-none focus:border-brand focus:bg-slate-900 transition-all shadow-inner"
                                    />
                                </div>
                            </div>

                            {errorMsg && (
                                <div className={`text-xs font-bold p-4 rounded-2xl border flex items-start gap-3 animate-fade-up shadow-inner ${errorType === 'warning' ? 'bg-amber-950/40 border-amber-900/50 text-amber-400' : 'bg-red-950/40 border-red-900/50 text-red-400'}`}>
                                    <Icon name={errorType === 'warning' ? 'alert-circle' : 'alert-triangle'} size={18} className="shrink-0 mt-0.5" /> 
                                    <span className="leading-relaxed">{errorMsg}</span>
                                </div>
                            )}

                            <button 
                                type="submit"
                                disabled={loading}
                                className="w-full py-4 mt-2 bg-gradient-to-r from-brand to-brand-light hover:from-brand-light hover:to-brand text-white rounded-2xl font-black text-sm shadow-float transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer relative overflow-hidden group"
                            >
                                <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                                {loading ? (
                                    <span className="flex items-center gap-2 relative z-10"><span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Anmeldung läuft...</span>
                                ) : (
                                    <span className="flex items-center gap-2 relative z-10">Sicher einloggen <Icon name="arrow-right" size={16} /></span>
                                )}
                            </button>
                        </form>

                        <div className="mt-8 text-center border-t border-slate-800 pt-6">
                            <p className="text-xs text-slate-400 font-medium">
                                Neu im Team? <a href="?activate=true" className="text-brand font-black hover:text-brand-light transition ml-1">Jetzt App verifizieren</a>
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 2. ONBOARDING FLOW (Registrierung via Aushang / Link)
        // =========================================================================
        const OnboardingFlow = ({ onLoginSuccess }) => {
            const [step, setStep] = useState(1);
            const [pin, setPin] = useState('');
            const [staffData, setStaffData] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [accepted, setAccepted] = useState(false);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handlePinSubmit = async (e) => {
                e.preventDefault();
                if (!pin || pin.length < 4) {
                    setErrorMsg('Bitte 4-stellige Mitarbeiter-PIN eingeben.');
                    return;
                }
                setLoading(true);
                setErrorMsg('');

                try {
                    const response = await fetch(`${API_BASE}/staff/login-pin`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: pin.trim(), appId: 'schnitzelwelt' })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        setStaffData(data.user);
                        setStep(3);
                    } else {
                        setErrorMsg(data.message || 'Mitarbeiter nicht gefunden. PIN korrekt?');
                    }
                } catch (err) {
                    if (pin === '1414') {
                        setStaffData({ id: 99, name: 'Test Mitarbeiter', role: 'Service', branch: 'Meppen' });
                        setStep(3);
                    } else {
                        setErrorMsg('Keine Verbindung zum Server.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleSetupSubmit = async (e) => {
                e.preventDefault();
                if (!email || !password || !accepted) return;
                setLoading(true);

                try {
                    await fetch(`${API_BASE}/crownchat/register-setup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ staffId: staffData?.id, email, password })
                    });
                } catch (err) {}

                setTimeout(() => {
                    setLoading(false);
                    onLoginSuccess(staffData || { name: 'Mitarbeiter', role: 'Team', branch: 'Meppen' });
                }, 800);
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-slate-100 p-4 font-sans">
                    <div className="w-full max-w-md bg-white rounded-[2rem] shadow-google overflow-hidden border border-slate-200 animate-fade-up">
                        
                        {step === 1 && (
                            <div className="p-8 text-center space-y-6 relative">
                                <div className="absolute top-0 inset-x-0 h-1 bg-brand"></div>
                                <div className="w-20 h-20 bg-brand-50 text-brand rounded-3xl flex items-center justify-center mx-auto shadow-inner border border-brand-100 mt-4">
                                    <Icon name="qr-code" size={40} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">App Aktivierung</h1>
                                    <p className="text-xs text-slate-500 mt-1 font-semibold">CrownChat Enterprise Portal</p>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-left shadow-inner">
                                    <div className="flex items-center gap-2 text-brand font-black text-[11px] uppercase tracking-wider mb-2">
                                        <Icon name="shield-check" size={16} /> Verifizierung erforderlich
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed font-medium">
                                        Um dich sicher in die App einzuloggen, gleiche deine Daten jetzt einmalig mit dem GastroCrown System ab.
                                    </p>
                                </div>
                                <button 
                                    onClick={() => setStep(2)}
                                    className="w-full py-4 bg-brand hover:bg-brand-light text-white rounded-xl font-black text-sm shadow-google transition-all active:scale-95 flex items-center justify-center gap-2"
                                >
                                    Jetzt verifizieren <Icon name="arrow-right" size={18} />
                                </button>
                                <button onClick={() => window.location.href = '/'} className="text-xs font-bold text-slate-400 mt-4 hover:text-slate-600">Zurück zum Login</button>
                            </div>
                        )}

                        {step === 2 && (
                            <form onSubmit={handlePinSubmit} className="p-8 space-y-6 relative">
                                <div className="absolute top-0 inset-x-0 h-1 flex"><div className="w-1/2 bg-brand"></div><div className="w-1/2 bg-slate-200"></div></div>
                                
                                <div className="text-center mt-2">
                                    <div className="w-16 h-16 bg-slate-100 text-slate-700 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-inner">
                                        <Icon name="key" size={28} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Türsteher-Check</h2>
                                    <p className="text-xs text-slate-500 mt-1">Wer bist du im System?</p>
                                </div>

                                <div className="space-y-4 pt-2">
                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">Deine Mitarbeiter-PIN</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 transition-all">
                                            <Icon name="hash" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={pin}
                                                onChange={(e) => setPin(e.target.value)}
                                                placeholder="••••"
                                                maxLength="4"
                                                autoFocus
                                                className="bg-transparent w-full outline-none text-slate-900 font-black tracking-widest text-xl text-center"
                                            />
                                        </div>
                                    </div>

                                    {errorMsg && (
                                        <div className="text-red-600 text-xs font-bold bg-red-50 p-4 rounded-xl border border-red-200 flex items-center gap-2">
                                            <Icon name="alert-circle" size={16} className="shrink-0" /> {errorMsg}
                                        </div>
                                    )}
                                </div>

                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full py-4 bg-slate-900 hover:bg-black text-white rounded-xl font-black text-sm shadow-google transition-all active:scale-95 flex items-center justify-center gap-2"
                                >
                                    {loading ? 'Prüfe Datenbank...' : 'PIN bestätigen'}
                                </button>
                            </form>
                        )}

                        {step === 3 && (
                            <form onSubmit={handleSetupSubmit} className="p-8 space-y-6 relative">
                                <div className="absolute top-0 inset-x-0 h-1 bg-emerald-500"></div>

                                <div className="text-center mt-2">
                                    <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-inner">
                                        <Icon name="user-check" size={28} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Hallo {staffData?.name?.split(' ')[0] || 'Team'}!</h2>
                                    <p className="text-xs text-slate-500 mt-1">Identität bestätigt. Richte nun dein Login ein.</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">Private E-Mail Adresse</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 transition-all">
                                            <Icon name="mail" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="email" 
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                placeholder="name@beispiel.de"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">Neues App-Passwort</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 transition-all">
                                            <Icon name="key" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="Mind. 8 Zeichen"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <label className="flex items-start gap-3 pt-3 cursor-pointer group bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-inner">
                                        <input 
                                            type="checkbox" 
                                            checked={accepted}
                                            onChange={(e) => setAccepted(e.target.checked)}
                                            className="mt-0.5 w-4 h-4 accent-brand rounded cursor-pointer shrink-0"
                                        />
                                        <div className="text-[11px] text-slate-600 leading-relaxed font-medium group-hover:text-slate-900 transition">
                                            <strong className="block text-slate-800 mb-1">Datenschutz (DSGVO):</strong> 
                                            Ich stimme zu, dass meine E-Mail für den App-Zugang verschlüsselt gespeichert wird. Nach Abschluss erhalte ich eine Bestätigungs-Mail.
                                        </div>
                                    </label>
                                </div>

                                <button 
                                    type="submit"
                                    disabled={!accepted || !email || !password || loading}
                                    className={`w-full py-4 rounded-xl font-black text-sm shadow-google transition-all flex items-center justify-center gap-2 ${accepted && email && password ? 'bg-brand hover:bg-brand-light text-white active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'}`}
                                >
                                    {loading ? 'Sichere Konto...' : 'Aktivierung abschließen'}
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 3. MAIN APP (Google Material 3 / Social Hybrid Dashboard)
        // =========================================================================
        const MainApp = ({ currentUser, onLogout }) => {
            const [activeTab, setActiveTab] = useState('feed'); 
            const [toast, setToast] = useState(null);

            const [posts, setPosts] = useState([
                {
                    id: 1,
                    author: 'Marvin Ringer',
                    role: 'Management',
                    date: 'Heute, 09:15',
                    channel: 'Team-Feed',
                    important: true,
                    text: 'Guten Morgen Crew! 🔥\n\nUnsere neue Schichtplanung für November ist online. Bitte prüft eure Verfügbarkeiten im Hub.',
                    image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80',
                    likes: 12,
                    liked: false,
                    seenBy: 18,
                    comments: 3
                }
            ]);
            const [newPostText, setNewPostText] = useState('');
            const [showPostModal, setShowPostModal] = useState(false);

            const [chats, setChats] = useState([
                { id: 1, name: '🍳 Küchen-Team Meppen', lastMsg: 'Zählung erfolgreich abgeschlossen ✅', time: '14:30', unread: 0, online: true, messages: [
                    { id: 1, sender: 'GastroCrown Bot', text: '14-Uhr Zählung in Meppen abgeschlossen.', time: '14:05', isMe: false }
                ]},
                { id: 2, name: '👥 Alle Mitarbeiter', lastMsg: 'Wochenplan ist online!', time: 'Gestern', unread: 2, online: false, messages: [
                    { id: 1, sender: 'Admin', text: 'Wochenplan ist online!', time: 'Gestern', isMe: false }
                ]},
                { id: 3, name: 'Marina Jänen', lastMsg: 'Brauchen dringend Servietten vorne.', time: '11:15', unread: 0, online: true, messages: [
                    { id: 1, sender: 'Marina', text: 'Brauchen dringend Servietten vorne.', time: '11:15', isMe: false }
                ]}
            ]);
            const [selectedChat, setSelectedChat] = useState(null);
            const [chatInput, setChatInput] = useState('');

            const triggerToast = (msg, type = 'info') => setToast({ message: msg, type });

            const handleCreatePost = (e) => {
                e.preventDefault();
                if (!newPostText.trim()) return;
                const newPost = {
                    id: Date.now(),
                    author: currentUser?.name || 'Mitarbeiter',
                    role: currentUser?.role || 'Team',
                    date: 'Gerade eben',
                    channel: 'Team-Feed',
                    important: false,
                    text: newPostText,
                    likes: 0,
                    liked: false,
                    seenBy: 1,
                    comments: 0
                };
                setPosts([newPost, ...posts]);
                setNewPostText('');
                setShowPostModal(false);
                triggerToast('Beitrag veröffentlicht!', 'success');

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">

                            </div>

                            {[
                                { id: 'feed', label: 'Home', icon: 'home' },
                                { id: 'chat', label: 'Nachrichten', icon: 'message-square' },
                                { id: 'schedule', label: 'Schichten', icon: 'calendar-days' },
                                { id: 'hub', label: 'Academy', icon: 'graduation-cap' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === tab.id ? 'bg-white text-slate-900 shadow-google' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-200/50'}`}
                                >
                                    <Icon name={tab.icon} size={16} className={activeTab === tab.id ? 'text-brand' : ''} /> {tab.label}
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-3">
                            <div onClick={() => setActiveTab('profile')} className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-sm cursor-pointer shadow-sm border-2 transition-all ${activeTab === 'profile' ? 'bg-brand text-white border-brand-100 shadow-google-hover' : 'bg-slate-100 text-slate-700 border-white hover:bg-slate-200'}`}>
                                {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                            </div>
                        </div>
                    </header>

                    <div className="md:hidden fixed bottom-0 inset-x-0 glass-header border-t border-slate-200 flex justify-around p-2 pb-safe z-40 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
                        {[

                            { id: 'chat', label: 'Chats', icon: 'message-square' },
                            { id: 'schedule', label: 'Plan', icon: 'calendar-days' },
                            { id: 'hub', label: 'Hub', icon: 'graduation-cap' },
                            { id: 'profile', label: 'Profil', icon: 'user' }

                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center justify-center w-16 h-12 rounded-xl transition-all ${activeTab === tab.id ? 'text-brand font-black' : 'text-slate-400 font-semibold hover:text-slate-600'}`}
                            >
                                <div className={`flex items-center justify-center w-8 h-8 rounded-full mb-0.5 transition-all ${activeTab === tab.id ? 'bg-brand-50' : ''}`}>
                                    <Icon name={tab.icon} size={activeTab === tab.id ? 22 : 20} strokeWidth={activeTab === tab.id ? 2.5 : 2} />
                                </div>
                                <span className="text-[10px]">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 pb-24 md:pb-8">
                        
                        {activeTab === 'feed' && (
                            <div className="space-y-6 animate-fade-up">
                                <div className="bg-white rounded-3xl shadow-google border border-slate-100 p-4 flex items-center gap-3 hover:shadow-google-hover transition-shadow cursor-text" onClick={() => setShowPostModal(true)}>
                                    <div className="w-10 h-10 rounded-full bg-brand-50 text-brand font-black flex items-center justify-center shrink-0 border border-brand-100">
                                        {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                    </div>
                                    <div className="flex-1 bg-slate-100/80 hover:bg-slate-200/60 transition rounded-full px-5 py-3 text-sm font-medium text-slate-500">
                                        Poste ein Update für dein Team...
                                    </div>
                                    <button className="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 hover:bg-slate-200 transition">
                                        <Icon name="image" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-5">
                                    {posts.map(post => (
                                        <div key={post.id} className="bg-white rounded-3xl shadow-google border border-slate-100 p-5 md:p-6 space-y-4">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-700 font-black flex items-center justify-center border border-slate-200">
                                                        <Icon name="megaphone" size={20} />
                                                    </div>
                                                    <div>
                                                        <h4 className="font-black text-sm text-slate-900">{post.author}</h4>
                                                        <div className="flex items-center gap-1.5 mt-0.5">
                                                            <span className="text-[11px] font-bold text-slate-500">{post.date}</span>
                                                            <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                                            <span className="text-[11px] font-bold text-brand">{post.channel}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                {post.important && (
                                                    <span className="bg-rose-50 text-brand text-[10px] font-black uppercase px-3 py-1 rounded-full border border-brand/20 flex items-center gap-1">
                                                        <Icon name="bell-ring" size={12} /> Wichtig
                                                    </span>
                                                )}
                                            </div>

                                            <p className="text-sm text-slate-800 leading-relaxed whitespace-pre-line font-medium">{post.text}</p>

                                            {post.image && (
                                                <div className="rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
                                                    <img src={post.image} className="w-full h-auto object-cover" />
                                                </div>
                                            )}

                                            <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                                <div className="flex items-center gap-1">
                                                    <button 
                                                        onClick={() => setPosts(posts.map(p => p.id === post.id ? { ...p, likes: p.liked ? p.likes - 1 : p.likes + 1, liked: !p.liked } : p))}
                                                        className={`px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 transition ${post.liked ? 'bg-rose-50 text-brand' : 'text-slate-600 hover:bg-slate-100'}`}
                                                    >
                                                        <Icon name="heart" size={18} className={post.liked ? 'fill-current' : ''} /> {post.likes}
                                                    </button>
                                                    <button onClick={() => triggerToast('Kommentare geöffnet')} className="px-4 py-2 rounded-full text-xs font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2 transition">
                                                        <Icon name="message-circle" size={18} /> {post.comments}
                                                    </button>
                                                </div>
                                                <span className="text-xs font-bold text-slate-400 flex items-center gap-1">
                                                    <Icon name="eye" size={16} /> {post.seenBy}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'chat' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 h-[76vh] bg-white rounded-3xl border border-slate-200 shadow-google overflow-hidden animate-fade-up">
                                <div className="border-r border-slate-200 p-4 flex flex-col bg-slate-50/50">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-black text-base text-slate-900">Chats</h3>
                                        <button onClick={() => triggerToast('➕ Neuer Gruppen-Chat')} className="p-2 bg-brand text-white rounded-xl shadow-md hover:bg-brand-light transition"><Icon name="plus" size={16} /></button>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto flex-1 no-scrollbar">
                                        {chats.map(c => (
                                            <div 
                                                key={c.id} 
                                                onClick={() => setSelectedChat(c)}
                                                className={`p-3.5 rounded-2xl cursor-pointer flex items-center justify-between transition ${selectedChat?.id === c.id ? 'bg-brand text-white shadow-md' : 'bg-white hover:bg-slate-100 border border-slate-200/60'}`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-11 h-11 rounded-2xl font-black flex items-center justify-center text-sm ${selectedChat?.id === c.id ? 'bg-white text-brand' : 'bg-brand-50 text-brand border border-brand-100'}`}>
                                                        {c.name.charAt(2) || c.name.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <div className={`font-extrabold text-xs ${selectedChat?.id === c.id ? 'text-white' : 'text-slate-900'}`}>{c.name}</div>
                                                        <div className={`text-[11px] truncate mt-0.5 font-medium ${selectedChat?.id === c.id ? 'text-white/80' : 'text-slate-500'}`}>{c.lastMsg}</div>
                                                    </div>
                                                </div>
                                                {c.unread > 0 && <span className="bg-emerald-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-xs">{c.unread}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="md:col-span-2 flex flex-col bg-slate-50">
                                    {selectedChat ? (
                                        <>
                                            <div className="p-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-xs">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-brand text-white font-black flex items-center justify-center text-xs">
                                                        {selectedChat.name.charAt(2) || selectedChat.name.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-sm text-slate-900">{selectedChat.name}</div>
                                                        <div className="text-[10px] text-emerald-600 font-extrabold">Aktiv</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => triggerToast('📞 Audioanruf gestartet')} className="p-2.5 bg-slate-100 rounded-xl text-slate-700 hover:bg-slate-200 transition"><Icon name="phone" size={18} /></button>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 p-5 overflow-y-auto space-y-3 no-scrollbar">
                                                {selectedChat.messages.map(m => (
                                                    <div key={m.id} className={`flex flex-col max-w-[70%] ${m.isMe ? 'ml-auto items-end' : 'items-start'}`}>
                                                        <div className={`p-4 rounded-3xl text-xs font-medium shadow-xs ${m.isMe ? 'bg-brand text-white rounded-br-xs' : 'bg-white text-slate-800 rounded-bl-xs border border-slate-200'}`}>
                                                            <div>{m.text}</div>
                                                            <div className={`text-[9px] mt-1 text-right ${m.isMe ? 'text-white/70' : 'text-slate-400'}`}>{m.time}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="p-4 bg-white border-t border-slate-200 flex gap-3">
                                                <input 
                                                    type="text" 
                                                    value={chatInput} 
                                                    onChange={e => setChatInput(e.target.value)} 
                                                    onKeyDown={e => { if(e.key === 'Enter') { if (!chatInput.trim()) return; setSelectedChat({...selectedChat, messages: [...selectedChat.messages, { id: Date.now(), sender: 'Du', text: chatInput, time: 'Gerade eben', isMe: true }]}); setChatInput(''); }}}
                                                    placeholder="Nachricht schreiben..."
                                                    className="flex-1 bg-slate-100 rounded-2xl px-5 py-3 text-xs font-medium outline-none focus:bg-white focus:ring-2 focus:ring-brand/20 transition"
                                                />
                                                <button onClick={() => { if (!chatInput.trim()) return; setSelectedChat({...selectedChat, messages: [...selectedChat.messages, { id: Date.now(), sender: 'Du', text: chatInput, time: 'Gerade eben', isMe: true }]}); setChatInput(''); }} className="bg-brand hover:bg-brand-light text-white px-6 rounded-2xl font-black text-xs shadow-md transition active:scale-95">Senden</button>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
                                            <Icon name="message-square" size={48} className="mb-3 opacity-30" />
                                            <p className="text-sm font-bold">Wähle einen Chat aus.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'schedule' && (
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-google p-8 space-y-6 animate-fade-up max-w-4xl mx-auto">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900">Dienstplan Oktober 2026</h2>
                                        <p className="text-xs text-slate-500 mt-1 font-semibold">Deine persönlichen Schichten</p>
                                    </div>
                                    <div className="bg-rose-50 text-brand px-5 py-2.5 rounded-2xl font-black text-xs border border-rose-200 shadow-xs">
                                        Monatssoll: 160 Std. / Erfasst: 42 Std.
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="p-6 rounded-3xl border-l-8 border-l-brand bg-slate-50 border border-slate-200 space-y-3 shadow-sm hover:shadow-google transition">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-black uppercase text-brand bg-brand-50 px-3 py-1 rounded-full">Front of House</span>
                                            <span className="text-xs font-black text-slate-500">Morgen, Do. 22. Okt</span>
                                        </div>
                                        <h4 className="font-black text-xl text-slate-900">09:00 - 17:00 Uhr</h4>
                                        <p className="text-xs text-slate-600 font-medium flex items-center gap-1.5"><Icon name="map-pin" size={14} /> Schnitzelwelt Meppen • Hauptkasse & Service</p>
                                    </div>

                                    <div className="p-6 rounded-3xl border-l-8 border-l-slate-700 bg-slate-50 border border-slate-200 space-y-3 shadow-sm hover:shadow-google transition">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-black uppercase text-slate-700 bg-slate-200 px-3 py-1 rounded-full">Back of House</span>
                                            <span className="text-xs font-black text-slate-500">Fr. 23. Okt</span>
                                        </div>
                                        <h4 className="font-black text-xl text-slate-900">11:00 - 19:30 Uhr</h4>
                                        <p className="text-xs text-slate-600 font-medium flex items-center gap-1.5"><Icon name="map-pin" size={14} /> Schnitzelwelt Meppen • Küche & Standard</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'hub' && (
                            <div className="space-y-6 animate-fade-up max-w-4xl mx-auto">
                                <div className="bg-brand text-white rounded-3xl p-8 shadow-google flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden">
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>
                                    <div className="relative z-10">
                                        <span className="bg-white/20 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full">Offizieller Onboarding-Kurs</span>
                                        <h2 className="text-3xl font-black mt-2">Willkommen bei Schnitzelwelt</h2>
                                        <p className="text-xs text-white/80 mt-1 font-medium">Lerne unsere Qualitätsstandards und erhalte dein exklusives Abzeichen.</p>
                                    </div>
                                    <button onClick={() => triggerToast('📚 Kurs wird geöffnet...')} className="bg-white text-brand px-7 py-3.5 rounded-2xl font-black text-xs shadow-xl hover:bg-slate-100 transition relative z-10">
                                        Kurs starten →
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    {[
                                        { title: 'Die Schnitzelwelt Art', category: 'Service am Gast', time: '2 Min.', icon: 'coffee' },
                                        { title: 'Goldene Panade Standard', category: 'Küche', time: '3 Min.', icon: 'utensils' },
                                        { title: '14-Uhr Zählung & SmartPrep', category: 'Management', time: '2 Min.', icon: 'shield-check' }
                                    ].map((h, i) => (
                                        <div key={i} onClick={() => triggerToast(`📖 Lese: ${h.title}`)} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3 cursor-pointer hover:border-brand hover:shadow-google transition group">
                                            <div className="w-12 h-12 rounded-2xl bg-brand-50 text-brand flex items-center justify-center font-bold group-hover:scale-105 transition">
                                                <Icon name={h.icon} size={20} />
                                            </div>
                                            <span className="text-[10px] font-black uppercase text-brand bg-rose-50 px-3 py-1 rounded-full">{h.category}</span>
                                            <h4 className="font-black text-sm text-slate-900 leading-snug">{h.title}</h4>
                                            <div className="text-xs text-slate-400 font-semibold flex items-center gap-1.5"><Icon name="clock" size={14} /> Lesezeit: {h.time}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="max-w-xl mx-auto space-y-6 animate-fade-up">
                                <div className="bg-white rounded-3xl shadow-google border border-slate-100 p-8 text-center relative overflow-hidden">
                                    <div className="absolute top-0 inset-x-0 h-24 bg-gradient-to-br from-slate-800 to-slate-900"></div>
                                    
                                    <div className="relative mx-auto w-28 h-28 rounded-full border-4 border-white bg-white shadow-md mb-4 mt-8 flex items-center justify-center">
                                        <div className="w-full h-full rounded-full bg-brand text-white font-black text-4xl flex items-center justify-center">
                                            {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                        </div>
                                        <div className="absolute bottom-1 right-1 w-6 h-6 bg-emerald-500 border-2 border-white rounded-full"></div>
                                    </div>
                                    
                                    <h2 className="text-2xl font-black text-slate-900">{currentUser?.name || 'Marvin Ringer'}</h2>
                                    <p className="text-sm text-slate-500 font-bold mt-1 mb-6">{currentUser?.role || 'Service'} • {currentUser?.branch || 'Meppen'}</p>
                                    
                                    <button onClick={() => { onLogout(); triggerToast('Erfolgreich abgemeldet', 'success'); }} className="mx-auto px-6 py-3 bg-slate-100 text-slate-700 rounded-2xl font-black text-sm hover:bg-red-50 hover:text-red-600 transition flex items-center justify-center gap-2">
                                        <Icon name="log-out" size={16} /> Sicher Abmelden
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {showPostModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] flex items-end md:items-center justify-center p-0 md:p-4 animate-fade-up">
                            <div className="bg-white w-full md:max-w-lg rounded-t-[2rem] md:rounded-[2rem] shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center p-5 border-b border-slate-100">
                                    <h3 className="font-black text-base text-slate-900">Beitrag erstellen</h3>
                                    <button onClick={() => setShowPostModal(false)} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="p-5 overflow-y-auto">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="w-10 h-10 rounded-full bg-brand-50 text-brand font-black flex items-center justify-center">
                                            {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                        </div>
                                        <div className="font-black text-sm text-slate-900">{currentUser?.name || 'Marvin'}</div>
                                    </div>
                                    <textarea 
                                        value={newPostText}
                                        onChange={e => setNewPostText(e.target.value)}
                                        placeholder="Was möchtest du dem Team mitteilen?"
                                        rows="6"
                                        className="w-full text-lg font-medium text-slate-800 outline-none resize-none placeholder-slate-300"
                                        autoFocus
                                    ></textarea>
                                </div>
                                <div className="p-4 border-t border-slate-100 flex justify-between items-center bg-slate-50 rounded-b-[2rem]">
                                    <div className="flex gap-2">
                                        <button className="w-10 h-10 rounded-full text-slate-500 hover:bg-slate-200 flex items-center justify-center transition"><Icon name="image" size={20} /></button>
                                        <button className="w-10 h-10 rounded-full text-slate-500 hover:bg-slate-200 flex items-center justify-center transition"><Icon name="map-pin" size={20} /></button>
                                    </div>
                                    <button 
                                        onClick={handleCreatePost} 
                                        disabled={!newPostText.trim()}
                                        className={`px-6 py-2.5 rounded-full font-black text-sm transition-all ${newPostText.trim() ? 'bg-brand text-white shadow-md active:scale-95' : 'bg-slate-200 text-slate-400'}`}
                                    >
                                        Posten
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        // =========================================================================
        // ROOT 
        // =========================================================================
        const App = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hasActivationLink = urlParams.has('activate');

            const [user, setUser] = useState(null);

            if (user) {
                return <MainApp currentUser={user} onLogout={() => setUser(null)} />;
            }

            if (!hasActivationLink) {
                return <LoginScreen onLoginSuccess={(userData) => setUser(userData)} />;
            }

            return <OnboardingFlow onLoginSuccess={(userData) => setUser(userData)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
