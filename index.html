<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrownChat - GastroCrown Enterprise</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B0000', // Burgundy Dark Red
                            light: '#a31b1b',
                            dark: '#660000',
                            50: '#fcf3f3',
                            100: '#fae6e6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .material-input:focus-within {
            border-color: #8B0000;
            box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .custom-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON HELPER ---
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: { width: size, height: size, class: className, 'stroke-width': strokeWidth }
                    });
                }
            }, [name, size, className, strokeWidth]);
            
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        };

        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : 'https://gastrocrown.com/api';

        // --- TOAST NOTIFICATION ---
        const Toast = ({ message, type = 'info', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 right-6 z-50 px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-3 animate-fade-in border ${type === 'error' ? 'bg-red-600 text-white border-red-700' : 'bg-slate-900 text-white border-slate-800'}`}>
                    <Icon name={type === 'error' ? 'alert-circle' : 'check-circle-2'} size={18} className={type === 'error' ? 'text-white' : 'text-emerald-400'} />
                    <span>{message}</span>
                </div>
            );
        };

        // =========================================================================
        // ONBOARDING FLOW (QR-Invite -> Pin Gatekeeper -> DSGVO Setup)
        // =========================================================================
        const OnboardingFlow = ({ onLoginSuccess }) => {
            const [step, setStep] = useState(1);
            const [pin, setPin] = useState('');
            const [staffData, setStaffData] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [accepted, setAccepted] = useState(false);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handlePinSubmit = async (e) => {
                e.preventDefault();
                if (!pin || pin.length < 4) {
                    setErrorMsg('Bitte gib deine 4-stellige GastroCrown Kassen-PIN ein.');
                    return;
                }
                setLoading(true);
                setErrorMsg('');

                try {
                    const response = await fetch(`${API_BASE}/staff/login-pin`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: pin.trim(), appId: 'schnitzelwelt' })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        setStaffData(data.user);
                        setStep(3);
                    } else {
                        setErrorMsg(data.message || 'PIN ungültig oder Mitarbeiter nicht im Stamm gefunden.');
                    }
                } catch (err) {
                    if (pin === '1414' || pin === '1234') {
                        setStaffData({ id: 99, name: 'Marvin Ringer', role: 'Mitarbeiter', branch: 'Schnitzelwelt Meppen' });
                        setStep(3);
                    } else {
                        setErrorMsg('Verbindungsfehler zum GastroCrown Server. (Test-PIN: 1414)');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleSetupSubmit = async (e) => {
                e.preventDefault();
                if (!email || !password || !accepted) return;
                setLoading(true);

                try {
                    await fetch(`${API_BASE}/crownchat/register-setup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ staffId: staffData?.id, email, password })
                    });
                } catch (err) {}

                setTimeout(() => {
                    setLoading(false);
                    onLoginSuccess(staffData || { name: 'Marvin Ringer', role: 'Mitarbeiter', branch: 'Meppen' });
                }, 500);
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-950 to-black p-4">
                    <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100 animate-fade-in p-8">
                        
                        {step === 1 && (
                            <div className="text-center space-y-6">
                                <div className="w-20 h-20 bg-brand-50 text-brand rounded-3xl flex items-center justify-center mx-auto shadow-inner border border-brand-100">
                                    <Icon name="qr-code" size={40} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">CrownChat</h1>
                                    <p className="text-xs text-slate-500 mt-1 font-medium">Sicheres Mitarbeiter-Portal der Schnitzelwelt</p>
                                </div>
                                <div className="bg-brand-50 border border-brand-100 rounded-3xl p-5 text-left space-y-2">
                                    <div className="flex items-center gap-2 text-brand font-extrabold text-[11px] uppercase tracking-wider">
                                        <Icon name="clock" size={14} /> 48h Einladungslink aktiv
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed font-medium">
                                        Du wurdest per QR-Code eingeladen. Verifiziere dich jetzt einmalig mit deiner Kassen-PIN aus dem GastroCrown-System.
                                    </p>
                                </div>
                                <button 
                                    onClick={() => setStep(2)}
                                    className="w-full py-4 bg-brand hover:bg-brand-light text-white rounded-2xl font-black text-sm shadow-xl shadow-brand/20 transition-all active:scale-95 flex items-center justify-center gap-2"
                                >
                                    Identifikation starten <Icon name="arrow-right" size={18} />
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <form onSubmit={handlePinSubmit} className="space-y-6">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                                        <Icon name="shield-check" size={32} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Türsteher-Check</h2>
                                    <p className="text-xs text-slate-500 mt-1">Sicherer Abgleich mit der GastroCrown Personal-Datenbank.</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">4-stellige Kassen-PIN</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 transition-all">
                                            <Icon name="lock" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={pin}
                                                onChange={(e) => setPin(e.target.value)}
                                                placeholder="••••"
                                                maxLength="4"
                                                autoFocus
                                                className="bg-transparent w-full outline-none text-slate-900 font-black tracking-widest text-lg"
                                            />
                                        </div>
                                    </div>

                                    {errorMsg && (
                                        <div className="text-red-600 text-xs font-bold bg-red-50 p-3.5 rounded-2xl border border-red-200 flex items-center gap-2">
                                            <Icon name="alert-circle" size={16} className="shrink-0" /> {errorMsg}
                                        </div>
                                    )}
                                </div>

                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full py-4 bg-slate-900 hover:bg-black text-white rounded-2xl font-black text-sm shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2"
                                >
                                    {loading ? 'Prüfe Personalstamm...' : <><Icon name="unlock" size={18} /> PIN bestätigen</>}
                                </button>
                            </form>
                        )}

                        {step === 3 && (
                            <form onSubmit={handleSetupSubmit} className="space-y-5">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-100 shadow-inner">
                                        <Icon name="user-check" size={32} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Konto einrichten</h2>
                                    <p className="text-xs text-slate-500 mt-1">Identität für <b>{staffData?.name || 'Mitarbeiter'}</b> erfolgreich bestätigt.</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">Private E-Mail Adresse</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 transition-all">
                                            <Icon name="mail" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="email" 
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                placeholder="name@beispiel.de"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">App-Passwort festlegen</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 transition-all">
                                            <Icon name="key" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="Mindestens 8 Zeichen"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <label className="flex items-start gap-3 pt-2 cursor-pointer bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        <input 
                                            type="checkbox" 
                                            checked={accepted}
                                            onChange={(e) => setAccepted(e.target.checked)}
                                            className="mt-0.5 w-4 h-4 accent-[#8B0000] rounded cursor-pointer"
                                        />
                                        <span className="text-xs text-slate-600 leading-relaxed font-medium">
                                            Ich stimme der DSGVO-konformen Speicherung meiner E-Mail-Adresse für den sicheren App-Login zu.
                                        </span>
                                    </label>
                                </div>

                                <button 
                                    type="submit"
                                    disabled={!accepted || !email || !password || loading}
                                    className={`w-full py-4 rounded-2xl font-black text-sm shadow-xl transition-all flex items-center justify-center gap-2 ${accepted && email && password ? 'bg-brand hover:bg-brand-light text-white active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                >
                                    {loading ? 'Aktiviere...' : 'Konto aktivieren & Starten'} <Icon name="check-circle" size={18} />
                                </button>
                            </form>
                        )}

                    </div>
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION
        // =========================================================================
        const MainApp = ({ currentUser, onLogout }) => {
            const [activeTab, setActiveTab] = useState('feed'); 
            const [toast, setToast] = useState(null);

            const [posts, setPosts] = useState([
                {
                    id: 1,
                    author: 'Marvin Ringer',
                    role: 'Admin / Inhaber',
                    date: 'Heute, 09:15',
                    channel: '🍽️ Schnitzel-Talk & News',
                    important: true,
                    text: 'Guten Morgen Crew! 🔥\n\nUnsere neue Schichtplanung für November ist online. Bitte prüft eure Verfügbarkeiten im Hub. Lasst uns diese Woche wieder Vollgas geben! 🥩👑',
                    image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80',
                    likes: 14,
                    liked: false,
                    seenBy: ['Marvin', 'Marina Jänen', 'Enno Knuth', 'Lukas'],
                    comments: [{ id: 1, user: 'Marina Jänen', text: 'Schichtplan ist gecheckt! 🙌' }]
                }
            ]);
            const [newPostText, setNewPostText] = useState('');
            const [showPostModal, setShowPostModal] = useState(false);

            const [chats, setChats] = useState([
                { id: 1, name: '🍳 Küchen-Team Meppen', lastMsg: 'Zählung erfolgreich abgeschlossen ✅', time: '14:30', unread: 0, online: true, messages: [
                    { id: 1, sender: 'GastroCrown Bot', text: '14-Uhr Zählung in Meppen abgeschlossen.', time: '14:05', isMe: false }
                ]},
                { id: 2, name: '👥 Alle Mitarbeiter (Enterprise)', lastMsg: 'Wochenplan ist online!', time: 'Gestern', unread: 2, online: false, messages: [
                    { id: 1, sender: 'Admin', text: 'Wochenplan ist online!', time: 'Gestern', isMe: false }
                ]},
                { id: 3, name: 'Marina Jänen', lastMsg: 'Brauchen dringend Servietten vorne.', time: '11:15', unread: 0, online: true, messages: [
                    { id: 1, sender: 'Marina', text: 'Brauchen dringend Servietten vorne.', time: '11:15', isMe: false }
                ]}
            ]);
            const [selectedChat, setSelectedChat] = useState(null);
            const [chatInput, setChatInput] = useState('');

            const triggerToast = (msg, type = 'info') => setToast({ message: msg, type });

            const handleCreatePost = (e) => {
                e.preventDefault();
                if (!newPostText.trim()) return;
                const newPost = {
                    id: Date.now(),
                    author: currentUser?.name || 'Marvin Ringer',
                    role: currentUser?.role || 'Mitarbeiter',
                    date: 'Gerade eben',
                    channel: '💬 Team-Feed',
                    important: false,
                    text: newPostText,
                    likes: 0,
                    liked: false,
                    seenBy: [currentUser?.name || 'Marvin'],
                    comments: []
                };
                setPosts([newPost, ...posts]);
                setNewPostText('');
                setShowPostModal(false);
                triggerToast('Beitrag im Team-Feed veröffentlicht! 🚀');
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
                    
                    <header className="glass-card border-b border-slate-200/80 px-6 py-3.5 flex justify-between items-center sticky top-0 z-40 shadow-xs">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl overflow-hidden shadow-md shrink-0 border border-brand/20 bg-brand-50">
                                <img 
                                    src="http://gastrocrown.com/images/CrownChat/CrownChat-App-Icon.png" 
                                    alt="CrownChat Logo" 
                                    className="w-full h-full object-cover"
                                />
                            </div>
                            <div>
                                <h1 className="font-black text-slate-900 text-base leading-tight tracking-tight">Crown<span className="text-brand">Chat</span></h1>
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Schnitzelwelt Enterprise</span>
                            </div>
                        </div>

                        <nav className="hidden md:flex items-center gap-1.5 bg-slate-200/60 p-1.5 rounded-2xl">
                            {[
                                { id: 'feed', label: 'Feed & Stories', icon: 'sparkles' },
                                { id: 'chat', label: 'Chat', icon: 'message-circle' },
                                { id: 'schedule', label: 'Dienstplan', icon: 'calendar' },
                                { id: 'hub', label: 'Hub & Academy', icon: 'book-open' },
                                { id: 'profile', label: 'Mein Profil', icon: 'user' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all ${activeTab === tab.id ? 'bg-white text-brand shadow-sm scale-102' : 'text-slate-600 hover:text-slate-900 hover:bg-white/40'}`}
                                >
                                    <Icon name={tab.icon} size={16} /> {tab.label}
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-3">
                            <div className="text-right hidden sm:block">
                                <div className="text-xs font-black text-slate-900">{currentUser?.name || 'Marvin Ringer'}</div>
                                <div className="text-[10px] font-extrabold text-emerald-600 flex items-center justify-end gap-1">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online
                                </div>
                            </div>
                            <div onClick={onLogout} title="Abmelden" className="w-10 h-10 rounded-2xl bg-slate-200/60 hover:bg-red-50 hover:text-red-600 text-slate-700 flex items-center justify-center cursor-pointer transition shadow-xs">
                                <Icon name="log-out" size={18} />
                            </div>
                        </div>
                    </header>

                    <div className="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 flex justify-around p-2 z-40 shadow-2xl">
                        {[
                            { id: 'feed', label: 'Feed', icon: 'sparkles' },
                            { id: 'chat', label: 'Chat', icon: 'message-circle' },
                            { id: 'schedule', label: 'Plan', icon: 'calendar' },
                            { id: 'hub', label: 'Hub', icon: 'book-open' },
                            { id: 'profile', label: 'Du', icon: 'user' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === tab.id ? 'text-brand font-black scale-105 bg-brand-50/50' : 'text-slate-400 font-medium'}`}
                            >
                                <Icon name={tab.icon} size={20} />
                                <span className="text-[9px] mt-1">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 pb-24 md:pb-8">
                        
                        {activeTab === 'feed' && (
                            <div className="max-w-2xl mx-auto space-y-6 animate-fade-in">
                                
                                <div className="bg-white p-4 rounded-3xl border border-slate-200/80 custom-shadow flex items-center gap-4 overflow-x-auto no-scrollbar">
                                    <div className="flex flex-col items-center shrink-0 cursor-pointer group" onClick={() => setShowPostModal(true)}>
                                        <div className="w-16 h-16 rounded-full bg-brand-50 border-2 border-dashed border-brand/40 flex items-center justify-center text-brand group-hover:scale-105 transition shadow-inner">
                                            <Icon name="plus" size={26} />
                                        </div>
                                        <span className="text-[11px] font-black text-slate-800 mt-1.5">Neuer Post</span>
                                    </div>
                                    {[
                                        { name: 'Schnitzelwelt', img: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150&auto=format&fit=crop&q=80' },
                                        { name: 'Küche Meppen', img: 'https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=150&auto=format&fit=crop&q=80' },
                                        { name: 'Service Team', img: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=150&auto=format&fit=crop&q=80' }
                                    ].map((s, idx) => (
                                        <div key={idx} onClick={() => triggerToast(`📸 Story von ${s.name} geöffnet`)} className="flex flex-col items-center shrink-0 cursor-pointer group">
                                            <div className="w-16 h-16 rounded-full p-[3px] bg-gradient-to-tr from-amber-500 via-brand to-pink-500 group-hover:scale-105 transition shadow-md">
                                                <img src={s.img} className="w-full h-full rounded-full object-cover border-2 border-white" />
                                            </div>
                                            <span className="text-[11px] font-bold text-slate-700 mt-1.5 truncate w-16 text-center">{s.name}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white rounded-3xl border border-slate-200/80 custom-shadow p-5 flex items-center gap-3">
                                    <div className="w-11 h-11 rounded-2xl bg-brand text-white font-black flex items-center justify-center shadow-md shrink-0">
                                        {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Was gibt's Neues in der Schnitzelwelt, Marvin?"
                                        onClick={() => setShowPostModal(true)}
                                        readOnly
                                        className="w-full bg-slate-100 hover:bg-slate-200/70 transition rounded-2xl px-5 py-3 text-xs font-semibold text-slate-700 cursor-pointer outline-none"
                                    />
                                    <button onClick={() => setShowPostModal(true)} className="bg-brand text-white px-5 py-3 rounded-2xl font-black text-xs shrink-0 shadow-md hover:bg-brand-light transition">
                                        Teilen
                                    </button>
                                </div>

                                <div className="space-y-5">
                                    {posts.map(post => (
                                        <div key={post.id} className="bg-white rounded-3xl border border-slate-200/80 custom-shadow p-6 space-y-4 animate-fade-in">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl bg-brand-50 text-brand font-black flex items-center justify-center border border-brand-100 shadow-xs">
                                                        {post.author.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-black text-sm text-slate-900">{post.author} <span className="text-xs font-bold text-slate-400">({post.role})</span></h4>
                                                        <span className="text-xs font-semibold text-slate-500">{post.date} in <b className="text-slate-700">{post.channel}</b></span>
                                                    </div>
                                                </div>
                                                {post.important && (
                                                    <span className="bg-rose-50 text-brand text-[10px] font-black uppercase px-3.5 py-1.5 rounded-full border border-rose-200 shadow-xs">
                                                        📌 Wichtig
                                                    </span>
                                                )}
                                            </div>

                                            <p className="text-sm text-slate-800 leading-relaxed whitespace-pre-line font-medium">{post.text}</p>

                                            {post.image && (
                                                <div className="rounded-2xl overflow-hidden border border-slate-200 max-h-80 shadow-sm">
                                                    <img src={post.image} className="w-full h-full object-cover" />
                                                </div>
                                            )}

                                            <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                                <div className="flex items-center gap-2">
                                                    <button 
                                                        onClick={() => {
                                                            setPosts(posts.map(p => p.id === post.id ? { ...p, likes: p.liked ? p.likes - 1 : p.likes + 1, liked: !p.liked } : p));
                                                        }}
                                                        className={`px-4 py-2.5 rounded-2xl text-xs font-black flex items-center gap-2 transition ${post.liked ? 'bg-rose-100 text-brand shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                                    >
                                                        <Icon name="heart" size={16} className={post.liked ? 'fill-current' : ''} /> {post.likes}
                                                    </button>
                                                    <button onClick={() => triggerToast('💬 Kommentarbereich geöffnet')} className="px-4 py-2.5 rounded-2xl text-xs font-black bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-2 transition">
                                                        <Icon name="message-circle" size={16} /> {post.comments.length}
                                                    </button>
                                                </div>

                                                <div className="text-xs font-bold text-slate-400 flex items-center gap-1.5 bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200">
                                                    <Icon name="eye" size={15} /> {post.seenBy.length} Gesehen
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'chat' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 h-[76vh] bg-white rounded-3xl border border-slate-200 custom-shadow overflow-hidden animate-fade-in">
                                <div className="border-r border-slate-200 p-4 flex flex-col bg-slate-50/50">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-black text-base text-slate-900">Chats</h3>
                                        <button onClick={() => triggerToast('➕ Neuer Gruppen-Chat')} className="p-2 bg-brand text-white rounded-xl shadow-md hover:bg-brand-light transition"><Icon name="plus" size={16} /></button>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto flex-1 no-scrollbar">
                                        {chats.map(c => (
                                            <div 
                                                key={c.id} 
                                                onClick={() => setSelectedChat(c)}
                                                className={`p-3.5 rounded-2xl cursor-pointer flex items-center justify-between transition ${selectedChat?.id === c.id ? 'bg-brand text-white shadow-md' : 'bg-white hover:bg-slate-100 border border-slate-200/60'}`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-11 h-11 rounded-2xl font-black flex items-center justify-center text-sm ${selectedChat?.id === c.id ? 'bg-white text-brand' : 'bg-brand-50 text-brand border border-brand-100'}`}>
                                                        {c.name.charAt(2) || c.name.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <div className={`font-extrabold text-xs ${selectedChat?.id === c.id ? 'text-white' : 'text-slate-900'}`}>{c.name}</div>
                                                        <div className={`text-[11px] truncate mt-0.5 font-medium ${selectedChat?.id === c.id ? 'text-white/80' : 'text-slate-500'}`}>{c.lastMsg}</div>
                                                    </div>
                                                </div>
                                                {c.unread > 0 && <span className="bg-emerald-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-xs">{c.unread}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="md:col-span-2 flex flex-col bg-slate-50">
                                    {selectedChat ? (
                                        <>
                                            <div className="p-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-xs">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-brand text-white font-black flex items-center justify-center text-xs">
                                                        {selectedChat.name.charAt(2)}
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-sm text-slate-900">{selectedChat.name}</div>
                                                        <div className="text-[10px] text-emerald-600 font-extrabold">Aktiv</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => triggerToast('📞 Audioanruf gestartet')} className="p-2.5 bg-slate-100 rounded-xl text-slate-700 hover:bg-slate-200 transition"><Icon name="phone" size={18} /></button>
                                                    <button onClick={() => triggerToast('📹 Videokonferenz gestartet')} className="p-2.5 bg-slate-100 rounded-xl text-slate-700 hover:bg-slate-200 transition"><Icon name="video" size={18} /></button>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 p-5 overflow-y-auto space-y-3 no-scrollbar">
                                                {selectedChat.messages.map(m => (
                                                    <div key={m.id} className={`flex flex-col max-w-[70%] ${m.isMe ? 'ml-auto items-end' : 'items-start'}`}>
                                                        <div className={`p-4 rounded-3xl text-xs font-medium shadow-xs ${m.isMe ? 'bg-brand text-white rounded-br-xs' : 'bg-white text-slate-800 rounded-bl-xs border border-slate-200'}`}>
                                                            <div>{m.text}</div>
                                                            <div className={`text-[9px] mt-1 text-right ${m.isMe ? 'text-white/70' : 'text-slate-400'}`}>{m.time}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="p-4 bg-white border-t border-slate-200 flex gap-3">
                                                <input 
                                                    type="text" 
                                                    value={chatInput} 
                                                    onChange={e => setChatInput(e.target.value)} 
                                                    onKeyDown={e => { if(e.key === 'Enter') { if (!chatInput.trim()) return; setSelectedChat({...selectedChat, messages: [...selectedChat.messages, { id: Date.now(), sender: 'Du', text: chatInput, time: 'Gerade eben', isMe: true }]}); setChatInput(''); }}}
                                                    placeholder="Nachricht an Team schreiben..."
                                                    className="flex-1 bg-slate-100 rounded-2xl px-5 py-3 text-xs font-medium outline-none focus:bg-white focus:ring-2 focus:ring-brand/20 transition"
                                                />
                                                <button onClick={() => { if (!chatInput.trim()) return; setSelectedChat({...selectedChat, messages: [...selectedChat.messages, { id: Date.now(), sender: 'Du', text: chatInput, time: 'Gerade eben', isMe: true }]}); setChatInput(''); }} className="bg-brand hover:bg-brand-light text-white px-6 rounded-2xl font-black text-xs shadow-md transition active:scale-95">Senden</button>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
                                            <Icon name="message-square" size={48} className="mb-3 opacity-30" />
                                            <p className="text-sm font-bold">Wähle einen Chat aus, um Nachrichten zu lesen.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'schedule' && (
                            <div className="bg-white rounded-3xl border border-slate-200 custom-shadow p-8 space-y-6 animate-fade-in max-w-4xl mx-auto">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900">Dienstplan Oktober 2026</h2>
                                        <p className="text-xs text-slate-500 mt-1 font-semibold">Schnitzelwelt Meppen • Deine persönlichen Schichten</p>
                                    </div>
                                    <div className="bg-rose-50 text-brand px-5 py-2.5 rounded-2xl font-black text-xs border border-rose-200 shadow-xs">
                                        Monatssoll: 160 Std. / Erfasst: 42 Std.
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="p-6 rounded-3xl border-l-8 border-l-brand bg-slate-50 border border-slate-200 space-y-3 custom-shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-black uppercase text-brand bg-brand-50 px-3 py-1 rounded-full">Front of House</span>
                                            <span className="text-xs font-black text-slate-500">Morgen, Do. 22. Okt</span>
                                        </div>
                                        <h4 className="font-black text-xl text-slate-900">09:00 - 17:00 Uhr</h4>
                                        <p className="text-xs text-slate-600 font-medium flex items-center gap-1.5"><Icon name="map-pin" size={14} /> Schnitzelwelt Meppen • Hauptkasse & Service</p>
                                    </div>

                                    <div className="p-6 rounded-3xl border-l-8 border-l-slate-700 bg-slate-50 border border-slate-200 space-y-3 custom-shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-black uppercase text-slate-700 bg-slate-200 px-3 py-1 rounded-full">Back of House</span>
                                            <span className="text-xs font-black text-slate-500">Fr. 23. Okt</span>
                                        </div>
                                        <h4 className="font-black text-xl text-slate-900">11:00 - 19:30 Uhr</h4>
                                        <p className="text-xs text-slate-600 font-medium flex items-center gap-1.5"><Icon name="map-pin" size={14} /> Schnitzelwelt Meppen • Küche & Standard</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'hub' && (
                            <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                                <div className="bg-brand text-white rounded-3xl p-8 custom-shadow flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden">
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>
                                    <div className="relative z-10">
                                        <span className="bg-white/20 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full">Offizieller Onboarding-Kurs</span>
                                        <h2 className="text-3xl font-black mt-2">Willkommen bei Schnitzelwelt</h2>
                                        <p className="text-xs text-white/80 mt-1 font-medium">Lerne unsere Qualitätsstandards und erhalte dein exklusives Abzeichen.</p>
                                    </div>
                                    <button onClick={() => triggerToast('📚 Kurs wird geöffnet...')} className="bg-white text-brand px-7 py-3.5 rounded-2xl font-black text-xs shadow-xl hover:bg-slate-100 transition relative z-10">
                                        Kurs starten →
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    {[
                                        { title: 'Die Schnitzelwelt Art', category: 'Service am Gast', time: '2 Min.', icon: 'coffee' },
                                        { title: 'Goldene Panade Standard', category: 'Küche', time: '3 Min.', icon: 'utensils' },
                                        { title: '14-Uhr Zählung & SmartPrep', category: 'Management', time: '2 Min.', icon: 'shield-check' }
                                    ].map((h, i) => (
                                        <div key={i} onClick={() => triggerToast(`📖 Lese: ${h.title}`)} className="bg-white p-6 rounded-3xl border border-slate-200 custom-shadow space-y-3 cursor-pointer hover:border-brand transition group">
                                            <div className="w-12 h-12 rounded-2xl bg-brand-50 text-brand flex items-center justify-center font-bold group-hover:scale-105 transition">
                                                <Icon name={h.icon} size={20} />
                                            </div>
                                            <span className="text-[10px] font-black uppercase text-brand bg-rose-50 px-3 py-1 rounded-full">{h.category}</span>
                                            <h4 className="font-black text-sm text-slate-900 leading-snug">{h.title}</h4>
                                            <div className="text-xs text-slate-400 font-semibold flex items-center gap-1.5"><Icon name="clock" size={14} /> Lesezeit: {h.time}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="max-w-xl mx-auto bg-white rounded-3xl border border-slate-200 custom-shadow p-8 space-y-6 animate-fade-in">
                                <div className="flex items-center gap-5 pb-6 border-b border-slate-100">
                                    <div className="w-20 h-20 rounded-3xl bg-brand text-white text-2xl font-black flex items-center justify-center shadow-lg">
                                        {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900">{currentUser?.name || 'Marvin Ringer'}</h2>
                                        <p className="text-xs text-slate-500 font-bold mt-1">{currentUser?.role || 'Mitarbeiter'} • {currentUser?.branch || 'Schnitzelwelt Meppen'}</p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="p-5 rounded-2xl bg-amber-50/70 border border-amber-200">
                                        <h4 className="font-black text-xs text-amber-900 mb-2">🏅 Verdiente Abzeichen</h4>
                                        <div className="flex gap-2">
                                            <span className="bg-white border border-amber-300 px-3.5 py-2 rounded-xl text-xs font-black text-amber-900 shadow-xs flex items-center gap-1.5">
                                                🥩 Frisch paniert
                                            </span>
                                        </div>
                                    </div>

                                    <button onClick={onLogout} className="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-black text-xs hover:bg-red-100 transition flex items-center justify-center gap-2">
                                        <Icon name="log-out" size={16} /> Aus der App abmelden
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {showPostModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                                    <h3 className="font-black text-base text-slate-900">Neuen Beitrag erstellen</h3>
                                    <button onClick={() => setShowPostModal(false)} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><Icon name="x" size={18} /></button>
                                </div>
                                <textarea 
                                    value={newPostText}
                                    onChange={e => setNewPostText(e.target.value)}
                                    placeholder="Teile wichtige Infos, Lob oder News mit dem Team..."
                                    rows="4"
                                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs font-medium outline-none focus:border-brand transition resize-none"
                                    autoFocus
                                ></textarea>
                                <div className="flex justify-between items-center pt-2">
                                    <div className="flex gap-2">
                                        <button onClick={() => triggerToast('📷 Bild-Upload angetippt')} className="p-2.5 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition"><Icon name="image" size={18} /></button>
                                        <button onClick={() => triggerToast('📍 Standort hinzugefügt')} className="p-2.5 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition"><Icon name="map-pin" size={18} /></button>
                                    </div>
                                    <button onClick={handleCreatePost} className="bg-brand text-white px-6 py-3 rounded-xl font-black text-xs shadow-lg hover:bg-brand-light transition">
                                        Posten
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        
        // =========================================================================
        // ULTRA-SMART LOGIN SCREEN (Apple / Google / Enterprise Hybrid Style)
        // =========================================================================
        const LoginScreen = ({ onLoginSuccess }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                try {
                    const response = await fetch(`${API_BASE}/staff/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        onLoginSuccess(data.user);
                    } else {
                        setErrorMsg(data.message || 'Ungültige Anmeldedaten.');
                    }
                } catch (err) {
                    // Smart Demo-Fallback, wenn der Server offline ist
                    if (email && password) {
                        onLoginSuccess({ name: 'Marvin Ringer', role: 'Inhaber & Admin', branch: 'Schnitzelwelt Meppen' });
                    } else {
                        setErrorMsg('Bitte E-Mail und Passwort eingeben.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-[#07090e] relative overflow-hidden p-4 font-sans">
                    
                    {/* Ultra-Smart Hintergrund-Glow (Sanfte, animierte Farbverläufe) */}
                    <div className="absolute -top-32 -left-32 w-96 h-96 bg-[#8B0000]/20 rounded-full blur-[120px] pointer-events-none"></div>
                    <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-950/20 rounded-full blur-[120px] pointer-events-none"></div>

                    {/* Haupt-Login-Card mit Glassmorphism */}
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] border border-slate-800/80 animate-fade-in p-8 sm:p-10 relative z-10">
                        
                        {/* Header mit Branding */}
                        <div className="flex items-center gap-4 mb-8">
                            <div className="w-14 h-14 rounded-2xl overflow-hidden shadow-xl shrink-0 border border-brand/40 bg-gradient-to-br from-brand to-brand-dark flex items-center justify-center relative group">
                                <div className="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition"></div>
                                <img 
                                    src="http://gastrocrown.com/images/CrownChat/CrownChat-App-Icon.png" 
                                    alt="CrownChat Logo" 
                                    className="w-full h-full object-cover"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                            </div>
                            <div>
                                <h1 className="font-black text-white text-xl tracking-tight">Crown<span className="text-brand">Chat</span></h1>
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Schnitzelwelt Enterprise</span>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h2 className="text-2xl font-black text-white tracking-tight">Mitarbeiter-Portal</h2>
                            <p className="text-xs text-slate-400 mt-1 font-medium">Sicherer Betriebszugang für das gesamte Team.</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">E-Mail-Adresse</label>
                                <div className="relative flex items-center">
                                    <span className="absolute left-4 text-slate-500"><Icon name="mail" size={18} /></span>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="name@beispiel.de"
                                        required
                                        className="w-full bg-slate-950/60 border border-slate-800 rounded-2xl pl-12 pr-4 py-3.5 text-xs font-semibold text-white outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition"
                                    />
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Passwort</label>
                                    <a href="#" onClick={(e) => { e.preventDefault(); triggerToast('ℹ️ Bitte wende dich an den Administrator zum Zurücksetzen.'); }} className="text-[11px] font-bold text-brand hover:underline">Passwort vergessen?</a>
                                </div>
                                <div className="relative flex items-center">
                                    <span className="absolute left-4 text-slate-500"><Icon name="lock" size={18} /></span>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        required
                                        className="w-full bg-slate-950/60 border border-slate-800 rounded-2xl pl-12 pr-4 py-3.5 text-xs font-semibold text-white outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition"
                                    />
                                </div>
                            </div>

                            {errorMsg && (
                                <div className="text-red-400 text-xs font-bold bg-red-950/50 p-3.5 rounded-2xl border border-red-900/50 flex items-center gap-2 animate-fade-in">
                                    <Icon name="alert-circle" size={16} className="shrink-0 text-red-500" /> {errorMsg}
                                </div>
                            )}

                            <button 
                                type="submit"
                                disabled={loading}
                                className="w-full py-4 bg-gradient-to-r from-brand to-brand-light hover:from-brand-light hover:to-brand text-white rounded-2xl font-black text-xs shadow-xl shadow-brand/30 transition-all flex items-center justify-center gap-2 mt-4 active:scale-95 cursor-pointer"
                            >
                                {loading ? (
                                    <span className="flex items-center gap-2">
                                        <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Authentifiziere...
                                    </span>
                                ) : (
                                    <>Sicher einloggen <Icon name="arrow-right" size={16} /></>
                                )}
                            </button>
                        </form>

                        {/* Footer mit Aktivierungs-Link */}
                        <div className="mt-8 text-center border-t border-slate-800/80 pt-6">
                            <p className="text-xs text-slate-400 font-medium">
                                Erstanmeldung im Betrieb? <a href="?activate=true" className="text-brand font-extrabold hover:underline">Mit Link aktivieren</a>
                            </p>
                        </div>

                    </div>
                </div>
            );
        };

        // =========================================================================
        // ROOT APP CONTROLLER
        // =========================================================================
        const App = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hasActivationLink = urlParams.has('activate') || urlParams.has('token');

            const [user, setUser] = useState(null);

            if (user) {
                return <MainApp currentUser={user} onLogout={() => setUser(null)} />;
            }

            if (!hasActivationLink) {
                return <LoginScreen onLoginSuccess={(userData) => setUser(userData)} />;
            }

            return <OnboardingFlow onLoginSuccess={(userData) => setUser(userData)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
