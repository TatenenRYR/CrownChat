<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrownChat - GastroCrown Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#8B0000', // Burgundy Dark Red
                            light: '#a31b1b',
                            dark: '#660000',
                            50: '#fcf3f3',
                            100: '#fae6e6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .material-input:focus-within {
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.12);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON HELPER ---
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: { width: size, height: size, class: className, 'stroke-width': strokeWidth }
                    });
                }
            }, [name, size, className, strokeWidth]);
            
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        };

        // --- BACKEND API CONFIGURATION ---
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : 'https://gastrocrown.com/api';

        // --- TOAST NOTIFICATION COMPONENT ---
        const Toast = ({ message, type = 'info', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 right-6 z-50 px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-3 animate-fade-in border ${type === 'error' ? 'bg-red-600 text-white border-red-700' : 'bg-slate-900 text-white border-slate-700'}`}>
                    <Icon name={type === 'error' ? 'alert-circle' : 'check-circle-2'} size={18} className={type === 'error' ? 'text-white' : 'text-emerald-400'} />
                    <span>{message}</span>
                </div>
            );
        };

        // =========================================================================
        // ONBOARDING MODULE (QR-Invite -> Pin Gatekeeper -> Setup & DSGVO)
        // =========================================================================

        const OnboardingFlow = ({ onLoginSuccess }) => {
            const [step, setStep] = useState(1); // 1: Welcome, 2: Gatekeeper, 3: Setup
            const [pin, setPin] = useState('');
            const [staffData, setStaffData] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [accepted, setAccepted] = useState(false);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handlePinSubmit = async (e) => {
                e.preventDefault();
                if (!pin || pin.length < 4) {
                    setErrorMsg('Bitte gib deine 4-stellige GastroCrown Kassen-PIN ein.');
                    return;
                }
                setLoading(true);
                setErrorMsg('');

                try {
                    const response = await fetch(`${API_BASE}/staff/login-pin`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: pin.trim(), appId: 'schnitzelwelt' })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        setStaffData(data.user);
                        setStep(3);
                    } else {
                        setErrorMsg(data.message || 'PIN ungültig oder Mitarbeiter nicht im Stamm gefunden.');
                    }
                } catch (err) {
                    // Offline / Demo Fallback
                    if (pin === '1414' || pin === '1234') {
                        setStaffData({ id: 99, name: 'Marvin Ringer', role: 'Mitarbeiter', branch: 'Schnitzelwelt Meppen' });
                        setStep(3);
                    } else {
                        setErrorMsg('Verbindungsfehler zum GastroCrown Server. (Test-PIN: 1414)');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleSetupSubmit = async (e) => {
                e.preventDefault();
                if (!email || !password || !accepted) return;
                setLoading(true);

                try {
                    await fetch(`${API_BASE}/crownchat/register-setup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ staffId: staffData?.id, email, password })
                    });
                } catch (err) {}

                setTimeout(() => {
                    setLoading(false);
                    onLoginSuccess(staffData || { name: 'Marvin Ringer', role: 'Mitarbeiter', branch: 'Meppen' });
                }, 500);
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-slate-900 p-4">
                    <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200 animate-fade-in">
                        
                        {step === 1 && (
                            <div className="p-8 text-center space-y-6">
                                <div className="w-20 h-20 bg-brand-50 text-brand rounded-2xl flex items-center justify-center mx-auto shadow-sm border border-brand-100">
                                    <Icon name="qr-code" size={40} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">CrownChat</h1>
                                    <p className="text-sm text-slate-500 mt-1">Das offizielle Mitarbeiter-Dashboard</p>
                                </div>
                                <div className="bg-brand-50 border border-brand-100 rounded-2xl p-4 text-left">
                                    <div className="flex items-center gap-2 text-brand font-bold text-xs uppercase tracking-wider mb-1">
                                        <Icon name="clock" size={14} /> 48h Einladungslink aktiv
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed">
                                        Dein QR-Code wurde erfolgreich gescannt. Starte jetzt die einmalige Verifizierung mit deiner Kassen-PIN.
                                    </p>
                                </div>
                                <button 
                                    onClick={() => setStep(2)}
                                    className="w-full py-4 bg-brand hover:bg-brand-light text-white rounded-2xl font-bold shadow-lg shadow-brand/25 transition-all flex items-center justify-center gap-2"
                                >
                                    Identifikation starten <Icon name="arrow-right" size={18} />
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <form onSubmit={handlePinSubmit} className="p-8 space-y-6">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                        <Icon name="shield-check" size={32} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Türsteher-Check</h2>
                                    <p className="text-xs text-slate-500 mt-1">Gleiche deine Daten mit der GastroCrown Datenbank ab.</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-1.5">4-stellige Kassen-PIN</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 transition-all">
                                            <Icon name="lock" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={pin}
                                                onChange={(e) => setPin(e.target.value)}
                                                placeholder="••••"
                                                maxLength="4"
                                                autoFocus
                                                className="bg-transparent w-full outline-none text-slate-900 font-black tracking-widest text-lg"
                                            />
                                        </div>
                                    </div>

                                    {errorMsg && (
                                        <div className="text-red-600 text-xs font-bold bg-red-50 p-3 rounded-xl border border-red-200 flex items-center gap-2">
                                            <Icon name="alert-circle" size={16} className="shrink-0" /> {errorMsg}
                                        </div>
                                    )}
                                </div>

                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full py-4 bg-slate-900 hover:bg-black text-white rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2"
                                >
                                    {loading ? 'Prüfe Personalstamm...' : <><Icon name="unlock" size={18} /> PIN bestätigen</>}
                                </button>
                            </form>
                        )}

                        {step === 3 && (
                            <form onSubmit={handleSetupSubmit} className="p-8 space-y-5">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-100">
                                        <Icon name="user-check" size={32} />
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900">Konto einrichten</h2>
                                    <p className="text-xs text-slate-500 mt-1">Identität für <b>{staffData?.name || 'Mitarbeiter'}</b> bestätigt.</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-1.5">Private E-Mail Adresse</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 transition-all">
                                            <Icon name="mail" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="email" 
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                placeholder="name@beispiel.de"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-medium"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-1.5">App-Passwort festlegen</label>
                                        <div className="material-input flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 transition-all">
                                            <Icon name="key" size={18} className="text-slate-400 mr-3" />
                                            <input 
                                                type="password" 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="Mindestens 8 Zeichen"
                                                required
                                                className="bg-transparent w-full outline-none text-slate-900 text-sm font-medium"
                                            />
                                        </div>
                                    </div>

                                    <label className="flex items-start gap-3 pt-2 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={accepted}
                                            onChange={(e) => setAccepted(e.target.checked)}
                                            className="mt-1 w-4 h-4 accent-[#8B0000] rounded cursor-pointer"
                                        />
                                        <span className="text-xs text-slate-600 leading-relaxed">
                                            Ich stimme der DSGVO-konformen Speicherung meiner E-Mail-Adresse für den App-Login zu.
                                        </span>
                                    </label>
                                </div>

                                <button 
                                    type="submit"
                                    disabled={!accepted || !email || !password || loading}
                                    className={`w-full py-4 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 ${accepted && email && password ? 'bg-brand hover:bg-brand-light text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                >
                                    {loading ? 'Aktiviere...' : 'Konto aktivieren & Starten'} <Icon name="check-circle" size={18} />
                                </button>
                            </form>
                        )}

                    </div>
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION (Vollbild Dashboard mit allen 5 Modulen)
        // =========================================================================

        const MainDashboard = ({ currentUser, onLogout }) => {
            const [activeTab, setActiveTab] = useState('feed'); // feed, chat, schedule, hub, profile
            const [toast, setToast] = useState(null);

            // Feed States
            const [posts, setPosts] = useState([
                {
                    id: 1,
                    author: 'Marvin Ringer',
                    role: 'Admin',
                    date: 'Heute, 09:15',
                    channel: '🍽️ Schnitzel-Talk',
                    important: true,
                    text: 'So kann es manchmal ablaufen!\n\nBitte denkt daran, dass wir alle im Team zusammenarbeiten und aufeinander achten müssen. Danke für eure Aufmerksamkeit! 🙏',
                    likes: 5,
                    liked: false,
                    seenBy: ['Marvin', 'Marina Jänen'],
                    comments: [{ id: 1, user: 'Marina Jänen', text: 'Herzlich willkommen! 🙌' }]
                }
            ]);
            const [newPostText, setNewPostText] = useState('');
            const [showPostModal, setShowPostModal] = useState(false);
            const [activeStory, setActiveStory] = useState(null);

            // Chat States
            const [selectedChat, setSelectedChat] = useState({ id: 1, name: '🍳 Küchen-Team Meppen', unread: 0, messages: [
                { id: 1, sender: 'GastroCrown Bot', text: '14-Uhr Zählung in Meppen abgeschlossen.', time: '14:05', isMe: false }
            ]});
            const [chatInput, setChatInput] = useState('');

            // Hub States
            const [activeCourse, setActiveCourse] = useState(null);
            const [swipeVal, setSwipeVal] = useState(0);

            const triggerToast = (msg, type = 'info') => setToast({ message: msg, type });

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    
                    {/* TOP NAVIGATION HEADER */}
                    <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center sticky top-0 z-40 shadow-xs">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-brand text-white rounded-xl flex items-center justify-center font-black shadow">
                                <Icon name="crown" size={22} />
                            </div>
                            <div>
                                <h1 className="font-black text-slate-900 text-base leading-tight">Crown<span className="text-brand">Chat</span></h1>
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Schnitzelwelt Enterprise</span>
                            </div>
                        </div>

                        {/* NAV TABS */}
                        <nav className="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-2xl">
                            {[
                                { id: 'feed', label: 'Feed', icon: 'megaphone' },
                                { id: 'chat', label: 'Chat', icon: 'message-square' },
                                { id: 'schedule', label: 'Dienstplan', icon: 'calendar' },
                                { id: 'hub', label: 'Hub & Academy', icon: 'book-open' },
                                { id: 'profile', label: 'Du / Profil', icon: 'user' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === tab.id ? 'bg-white text-brand shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <Icon name={tab.icon} size={16} /> {tab.label}
                                </button>
                            ))}
                        </nav>

                        {/* USER PROFILE INFO */}
                        <div className="flex items-center gap-3">
                            <div className="text-right hidden sm:block">
                                <div className="text-xs font-bold text-slate-900">{currentUser?.name || 'Marvin Ringer'}</div>
                                <div className="text-[10px] font-medium text-emerald-600">Online • Meppen</div>
                            </div>
                            <div onClick={onLogout} title="Abmelden" className="w-10 h-10 rounded-xl bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 flex items-center justify-center cursor-pointer transition">
                                <Icon name="log-out" size={18} />
                            </div>
                        </div>
                    </header>

                    {/* MOBILE BOTTOM NAVIGATION (für kleine Bildschirme) */}
                    <div className="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around p-2 z-40 shadow-lg">
                        {[
                            { id: 'feed', label: 'Feed', icon: 'megaphone' },
                            { id: 'chat', label: 'Chat', icon: 'message-square' },
                            { id: 'schedule', label: 'Plan', icon: 'calendar' },
                            { id: 'hub', label: 'Hub', icon: 'book-open' },
                            { id: 'profile', label: 'Du', icon: 'user' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center p-2 rounded-xl ${activeTab === tab.id ? 'text-brand font-bold' : 'text-slate-400'}`}
                            >
                                <Icon name={tab.icon} size={20} />
                                <span className="text-[9px] mt-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 pb-24 md:pb-8">
                        
                        {/* 1. FEED MODUL */}
                        {activeTab === 'feed' && (
                            <div className="max-w-3xl mx-auto space-y-6 animate-fade-in">
                                
                                {/* 24h Stories Bar */}
                                <div className="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm flex items-center gap-4 overflow-x-auto no-scrollbar">
                                    <div className="flex flex-col items-center shrink-0 cursor-pointer" onClick={() => setShowPostModal(true)}>
                                        <div className="w-14 h-14 rounded-full bg-slate-100 border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                                            <Icon name="plus" size={24} />
                                        </div>
                                        <span className="text-[11px] font-bold text-slate-700 mt-1">Beitrag</span>
                                    </div>
                                    {[
                                        { name: 'Schnitzelwelt', img: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=150&auto=format&fit=crop&q=80', text: '🔥 Heute 18 Uhr: Kurzes Team-Briefing!' },
                                        { name: 'Küche Meppen', img: 'https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=150&auto=format&fit=crop&q=80', text: '✅ Kühlhaus-Check erfolgreich bestanden!' }
                                    ].map((s, idx) => (
                                        <div key={idx} onClick={() => setActiveStory(s)} className="flex flex-col items-center shrink-0 cursor-pointer group">
                                            <div className="w-14 h-14 rounded-full p-[2.5px] bg-gradient-to-tr from-amber-500 via-brand to-pink-500 group-hover:scale-105 transition">
                                                <img src={s.img} className="w-full h-full rounded-full object-cover border-2 border-white" />
                                            </div>
                                            <span className="text-[11px] font-bold text-slate-700 mt-1 truncate w-16 text-center">{s.name}</span>
                                        </div>
                                    ))}
                                </div>

                                {/* Feed Posts */}
                                <div className="space-y-4">
                                    {posts.map(post => (
                                        <div key={post.id} className="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl bg-brand-50 text-brand font-black flex items-center justify-center border border-brand-100">
                                                        {post.author.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-extrabold text-sm text-slate-900">{post.author} <span className="text-xs font-medium text-slate-400">({post.role})</span></h4>
                                                        <span className="text-xs text-slate-500">{post.date} in <b className="text-slate-700">{post.channel}</b></span>
                                                    </div>
                                                </div>
                                                {post.important && (
                                                    <span className="bg-rose-50 text-brand text-[10px] font-black uppercase px-3 py-1 rounded-full border border-rose-200">
                                                        📌 Wichtig
                                                    </span>
                                                )}
                                            </div>

                                            <p className="text-sm text-slate-800 leading-relaxed whitespace-pre-line">{post.text}</p>

                                            <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                                <div className="flex items-center gap-3">
                                                    <button 
                                                        onClick={() => {
                                                            setPosts(posts.map(p => p.id === post.id ? { ...p, likes: p.liked ? p.likes - 1 : p.likes + 1, liked: !p.liked } : p));
                                                        }}
                                                        className={`px-4 py-2 rounded-2xl text-xs font-bold flex items-center gap-2 transition ${post.liked ? 'bg-rose-100 text-brand' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                                    >
                                                        <Icon name="heart" size={16} /> {post.likes}
                                                    </button>
                                                    <span className="text-xs font-bold text-slate-500 flex items-center gap-1">
                                                        <Icon name="message-circle" size={16} /> {post.comments.length} Kommentare
                                                    </span>
                                                </div>

                                                <div className="text-xs font-bold text-slate-400 flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                                                    <Icon name="eye" size={15} /> {post.seenBy.length} Gesehen
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 2. CHAT MODUL */}
                        {activeTab === 'chat' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 h-[72vh] bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden animate-fade-in">
                                <div className="border-r border-slate-200 p-4 flex flex-col">
                                    <h3 className="font-black text-base text-slate-900 mb-3">Nachrichten</h3>
                                    <div className="space-y-2 overflow-y-auto flex-1">
                                        {[
                                            { name: '🍳 Küchen-Team Meppen', msg: 'Zählung erledigt', unread: 0 },
                                            { name: '👥 Alle Mitarbeiter', msg: 'Wochenplan ist da', unread: 2 },
                                            { name: 'Marina Jänen', msg: 'Brauchen Servietten', unread: 0 }
                                        ].map((c, idx) => (
                                            <div key={idx} className="p-3 hover:bg-slate-50 rounded-2xl cursor-pointer flex items-center justify-between">
                                                <div>
                                                    <div className="font-bold text-xs text-slate-900">{c.name}</div>
                                                    <div className="text-[11px] text-slate-500 truncate mt-0.5">{c.msg}</div>
                                                </div>
                                                {c.unread > 0 && <span className="bg-brand text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{c.unread}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="md:col-span-2 flex flex-col bg-slate-50/50">
                                    <div className="p-4 bg-white border-b border-slate-200 flex items-center justify-between">
                                        <div className="font-black text-sm text-slate-900">{selectedChat.name}</div>
                                        <div className="flex gap-2">
                                            <button onClick={() => triggerToast('📞 Audioanruf wird gestartet...')} className="p-2 bg-slate-100 rounded-xl text-slate-700 hover:bg-slate-200"><Icon name="phone" size={16} /></button>
                                        </div>
                                    </div>
                                    
                                    <div className="flex-1 p-4 overflow-y-auto space-y-3">
                                        {selectedChat.messages.map(m => (
                                            <div key={m.id} className={`flex flex-col max-w-[70%] ${m.isMe ? 'ml-auto items-end' : 'items-start'}`}>
                                                <div className={`p-3.5 rounded-2xl text-xs shadow-xs ${m.isMe ? 'bg-brand text-white rounded-br-xs' : 'bg-white text-slate-800 rounded-bl-xs border border-slate-200'}`}>
                                                    <div>{m.text}</div>
                                                    <div className="text-[9px] mt-1 text-right opacity-75">{m.time}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                                        <input 
                                            type="text" 
                                            value={chatInput} 
                                            onChange={e => setChatInput(e.target.value)} 
                                            placeholder="Nachricht schreiben..."
                                            className="flex-1 bg-slate-100 rounded-2xl px-4 py-2.5 text-xs outline-none"
                                        />
                                        <button onClick={() => { if (!chatInput.trim()) return; setSelectedChat({...selectedChat, messages: [...selectedChat.messages, { id: Date.now(), sender: 'Du', text: chatInput, time: 'Gerade eben', isMe: true }]}); setChatInput(''); }} className="bg-brand text-white px-5 rounded-2xl font-bold text-xs">Senden</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. DIENSTPLAN MODUL */}
                        {activeTab === 'schedule' && (
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-xl font-black text-slate-900">Dienstplan Oktober 2026</h2>
                                        <p className="text-xs text-slate-500 mt-0.5">Schnitzelwelt Meppen • Deine Arbeitszeit</p>
                                    </div>
                                    <div className="bg-rose-50 text-brand px-4 py-2 rounded-2xl font-extrabold text-xs border border-rose-200">
                                        Gesamt: 42 Std. / Soll: 160 Std.
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="p-5 rounded-2xl border-l-4 border-l-brand bg-slate-50 border border-slate-200 space-y-2">
                                        <span className="text-[10px] font-black uppercase text-brand bg-brand-50 px-2.5 py-1 rounded">Front of House</span>
                                        <h4 className="font-black text-lg text-slate-900">09:00 - 17:00 Uhr</h4>
                                        <p className="text-xs text-slate-500">Morgen, Do. 22. Okt • Theke & Service</p>
                                    </div>
                                    <div className="p-5 rounded-2xl border-l-4 border-l-slate-400 bg-slate-50 border border-slate-200 space-y-2">
                                        <span className="text-[10px] font-black uppercase text-slate-600 bg-slate-200 px-2.5 py-1 rounded">Back of House</span>
                                        <h4 className="font-black text-lg text-slate-900">11:00 - 19:30 Uhr</h4>
                                        <p className="text-xs text-slate-500">Fr. 23. Okt • Küchenleitung</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 4. HUB & ACADEMY MODUL */}
                        {activeTab === 'hub' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-brand text-white rounded-3xl p-8 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <span className="bg-white/20 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full">Einarbeitungskurs</span>
                                        <h2 className="text-2xl font-black mt-2">Willkommen bei Schnitzelwelt</h2>
                                        <p className="text-xs text-white/80 mt-1">Absolviere alle Checkpoints, um dein Badge im Profil freizuschalten.</p>
                                    </div>
                                    <button onClick={() => setActiveCourse({ title: 'Willkommen bei Schnitzelwelt', progress: 66 })} className="bg-white text-brand px-6 py-3 rounded-2xl font-black text-xs shadow hover:bg-slate-100 transition">
                                        Kurs fortsetzen →
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {[
                                        { title: 'Die Schnitzelwelt Art', category: 'Service am Gast', time: '2 Min.' },
                                        { title: 'Goldene Panade Standard', category: 'Küche', time: '3 Min.' },
                                        { title: '14-Uhr Zählung & SmartPrep', category: 'Management', time: '2 Min.' }
                                    ].map((h, i) => (
                                        <div key={i} className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3 cursor-pointer hover:border-brand transition">
                                            <span className="text-[10px] font-extrabold uppercase text-brand bg-rose-50 px-2.5 py-1 rounded-full">{h.category}</span>
                                            <h4 className="font-black text-sm text-slate-900">{h.title}</h4>
                                            <div className="text-xs text-slate-400 flex items-center gap-1"><Icon name="clock" size={14} /> Lesezeit: {h.time}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 5. PROFIL / DU MODUL */}
                        {activeTab === 'profile' && (
                            <div className="max-w-xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm p-8 space-y-6 animate-fade-in">
                                <div className="flex items-center gap-4 pb-6 border-b border-slate-100">
                                    <div className="w-20 h-20 rounded-2xl bg-brand text-white text-2xl font-black flex items-center justify-center shadow">
                                        {currentUser?.name ? currentUser.name.charAt(0) : 'M'}
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-black text-slate-900">{currentUser?.name || 'Marvin Ringer'}</h2>
                                        <p className="text-xs text-slate-500 font-medium mt-0.5">{currentUser?.role || 'Mitarbeiter'} • {currentUser?.branch || 'Schnitzelwelt Meppen'}</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200">
                                        <h4 className="font-extrabold text-xs text-amber-900 mb-1">🏅 Verdiente Abzeichen</h4>
                                        <div className="flex gap-2 mt-2">
                                            <span className="bg-white border border-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-900 shadow-xs">
                                                🥩 Frisch paniert
                                            </span>
                                        </div>
                                    </div>

                                    <button onClick={onLogout} className="w-full py-3.5 bg-red-50 text-red-600 rounded-2xl font-bold text-xs hover:bg-red-100 transition flex items-center justify-center gap-2">
                                        <Icon name="log-out" size={16} /> Aus der App abmelden
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* TOAST OVERLAY */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        // =========================================================================
        // ROOT APP CONTROLLER
        // =========================================================================

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            return (
                <div>
                    {!isLoggedIn ? (
                        <OnboardingFlow onLoginSuccess={(user) => { setCurrentUser(user); setIsLoggedIn(true); }} />
                    ) : (
                        <MainDashboard currentUser={currentUser} onLogout={() => { setIsLoggedIn(false); setCurrentUser(null); }} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
